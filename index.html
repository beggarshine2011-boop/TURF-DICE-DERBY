            const idx = DIST_CATEGORIES.indexOf(baseCat);
            if (idx === -1) return baseCat;
            const nextIdx = Math.max(0, Math.min(DIST_CATEGORIES.length - 1, idx + shift));

            const hIdx = DIST_CATEGORIES.indexOf(horseDistCat);

            let totalWeeks = age * 52;
            for (let m = 1; m < month; m++) {

            }

            if (!horse || horse.lastRaceWeek === null || horse.lastRaceWeek === undefined) {

            const currentWeek = getAbsoluteWeek(race.age, race.month, race.week);

        // 初期配布用・基本騎手アイテム4種（オークション対象外・各オーナー初期所持）
        const INITIAL_JOCKEY_ITEMS = [
            { id: 'init_j_nige', category: '騎手', name: '逃げの名手', desc: '競走馬の脚質が逃げの場合、出目の最大値と最小値をプラス1する。' },
            { id: 'init_j_senko', category: '騎手', name: '先行の名手', desc: '競走馬の脚質が先行の場合、出目の最大値と最小値をプラス1する。' },
            { id: 'init_j_sashi', category: '騎手', name: '差しの名手', desc: '競走馬の脚質が差しの場合、出目の最大値と最小値をプラス1する。' },
            { id: 'init_j_oikomi', category: '騎手', name: '追込みの名手', desc: '競走馬の脚質が追込みの場合、出目の最大値と最小値をプラス1する。' }
        ];

        const HORSE_WORDS_MALE = ['インパクト', 'キング', 'サンデー', 'ブラック', 'ゴールド', 'シップ', 'ネイア', 'カナロア', 'スズカ', 'ルドルフ', 'テイオー', 'ブライアン', 'フェスタ', 'ヴァーミリオン', 'クロフネ', 'オペラオー'];
        const HORSE_WORDS_FEMALE = ['クイーン', 'アイ', 'ドンナ', 'アレグリア', 'アイランド', 'ジェネシス', 'ビスタ', 'スカーレット', 'グルーヴ', 'ローズ', 'タクト', 'ホワイト', 'ウオッカ', 'ソダシ', 'アパパネ', 'ブエナ'];

        function formatMoney(manYen) {
            if (manYen === 0) return '0万円';
            const oku = Math.floor(manYen / 10000);
            const man = manYen % 10000;
            if (oku > 0 && man > 0) return `${oku}億${man.toLocaleString()}万円`;
            if (oku > 0) return `${oku}億円`;
            return `${man.toLocaleString()}万円`;
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // ==========================================
        // 2. メインゲームクラス
        // ==========================================
        class TurfDiceDerby {
            constructor() {
                this.roomId = null;
                this.playerId = this.getOrCreatePlayerId();
                this.roomData = null;
                this.unsubscribeRoom = null;
                this.selectedHorseId = null;
                this.bidAmount = 0;
                this.isProcessing = false;
                this.raceInterval = null;
                this.horseMemos = {};
            }

            adjustBidAmount(delta, maxBid) {
                const next = Math.max(0, Math.min(maxBid, (Number(this.bidAmount) || 0) + delta));
                this.bidAmount = next;
                this.renderGame();
            }

            resetBidAmount() {
                this.bidAmount = 0;
                this.renderGame();
            }

            isSecretMode(data = this.roomData) {
                const modeKey = data?.mode || 'classic';
                return Boolean(GAME_MODES[modeKey]?.isSecret);
            }

            getHorseMemo(horseId) {
                return this.horseMemos[horseId] || { distance: '', style: '', unruly: '' };
            }

            updateHorseMemo(horseId, field, value) {
                if (!this.horseMemos[horseId]) {
                    this.horseMemos[horseId] = { distance: '', style: '', unruly: '' };
                }
                this.horseMemos[horseId][field] = value;
                this.renderGame();
            }

            getOrCreatePlayerId() {
                let id = sessionStorage.getItem('tdd_player_id');
                if (!id) {
                    id = 'player_' + Math.random().toString(36).substring(2, 10);
                    sessionStorage.setItem('tdd_player_id', id);
                }
                return id;
            }

            generateRoomId() {
                return Math.floor(100000 + Math.random() * 900000).toString();
            }

            showToast(msg, type = 'info') {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const el = document.createElement('div');
                const colors = {
                    info: 'bg-emerald-900 border-emerald-500 text-white',
                    success: 'bg-amber-900 border-amber-400 text-amber-100',
                    error: 'bg-red-900 border-red-500 text-white'
                };
                el.className = `${colors[type] || colors.info} border px-4 py-3 rounded-xl shadow-xl text-sm font-bold transition-all duration-300`;
                el.textContent = msg;
                container.appendChild(el);
                setTimeout(() => {
                    el.style.opacity = '0';
                    setTimeout(() => el.remove(), 300);
                }, 3200);
            }

            getActiveRaces(data = this.roomData) {
                const modeKey = data?.mode || 'classic';
                return (GAME_MODES[modeKey] || GAME_MODES.classic).races;
            }

            // Firestore & LocalStorage 同期保存
            async saveRoomData(roomId, data) {
                this.roomData = data;
                if (firebaseDb) {
                    try {
                        await firebaseDb.collection('rooms').doc(roomId).set(data);
                        return;
                    } catch (err) {
                        console.warn('Firestore書き込みエラー、ローカル保存にフォールバック:', err);
                    }
                }
                localStorage.setItem('tdd_room_' + roomId, JSON.stringify(data));
                this.renderGame();
            }

            subscribeToRoom(roomId) {
                if (this.unsubscribeRoom) {
                    this.unsubscribeRoom();
                    this.unsubscribeRoom = null;
                }
                if (firebaseDb) {
                    this.unsubscribeRoom = firebaseDb.collection('rooms').doc(roomId).onSnapshot((doc) => {
                        if (doc.exists) {
                            const incoming = doc.data();
                            this.roomData = incoming;
                            this.handleHostAutoProgress(incoming);
                            this.renderGame();
                        }
                    }, (err) => {
                        console.error('Firestoreリアルタイム同期エラー:', err);
                    });
                } else {
                    window.addEventListener('storage', (e) => {
                        if (e.key === 'tdd_room_' + roomId && e.newValue) {
                            const incoming = JSON.parse(e.newValue);
                            this.roomData = incoming;
                            this.handleHostAutoProgress(incoming);
                            this.renderGame();
                        }
                    });
                }
            }

            async handleHostAutoProgress(incomingData) {
                if (!incomingData || incomingData.hostId !== this.playerId || this.isProcessing) return;

                if (incomingData.phase === 'auction' && incomingData.auction) {
                    const needsCpu = incomingData.players.some(p => p.isCpu && p.auctionBid === null);
                    const allBid = incomingData.players.every(p => p.auctionBid !== null);
                    if (needsCpu || allBid) {
                        this.isProcessing = true;
                        try {
                            const copy = JSON.parse(JSON.stringify(incomingData));
                            this.processAuctionProgress(copy);
                            await this.saveRoomData(this.roomId, copy);
                        } finally {
                            this.isProcessing = false;
                        }
                    }
                } else if (incomingData.phase === 'paddock') {
                    const needsCpu = incomingData.players.some(p => p.isCpu && !p.paddockReady);
                    const allReady = incomingData.players.every(p => p.paddockReady);
                    if (needsCpu || allReady) {
                        this.isProcessing = true;
                        try {
                            const copy = JSON.parse(JSON.stringify(incomingData));
                            this.processPaddockProgress(copy);
                            await this.saveRoomData(this.roomId, copy);
                        } finally {
                            this.isProcessing = false;
                        }
                    }
                }
            }

            generateStableHorses(ownerId, ownerName, includeFillies = false) {
                const horses = [];
                const maleDists = shuffleArray(DIST_CATEGORIES);
                const maleStyles = shuffleArray(STYLES);
                const unrulyMaleIdx = Math.floor(Math.random() * 4);
                const usedNames = new Set();

                const cleanCrown = (ownerName || 'オーナー').replace(/\(CPU\)$/i, '').trim() || 'オーナー';
                const buildHorseName = (baseWord) => {
                    return Math.random() < 0.5 ? `${cleanCrown}${baseWord}` : `${baseWord}${cleanCrown}`;
                };

                for (let i = 0; i < 4; i++) {
                    let name = '';
                    let attempts = 0;
                    do {
                        const baseWord = HORSE_WORDS_MALE[Math.floor(Math.random() * HORSE_WORDS_MALE.length)];
                        name = buildHorseName(baseWord);
                        attempts++;
                    } while (usedNames.has(name) && attempts < 50);
                    usedNames.add(name);

                    horses.push({
                        id: `${ownerId}_m_${i}`,
                        ownerId,
                        name,
                        sex: '牡',
                        distance: maleDists[i],
                        style: maleStyles[i],
                        isUnruly: i === unrulyMaleIdx,
                        baseMin: 10,
                        baseMax: 20,
                        wins: 0,
                        wonRaceNames: [],
                        lastRaceWeek: null
                    });
                }

                if (includeFillies) {
                    const femaleDists = shuffleArray(DIST_CATEGORIES);
                    const femaleStyles = shuffleArray(STYLES);
                    const unrulyFemaleIdx = Math.floor(Math.random() * 4);

                    for (let i = 0; i < 4; i++) {
                        let name = '';
                        let attempts = 0;
                        do {
                            const baseWord = HORSE_WORDS_FEMALE[Math.floor(Math.random() * HORSE_WORDS_FEMALE.length)];
                            name = buildHorseName(baseWord);
                            attempts++;
                        } while (usedNames.has(name) && attempts < 50);
                        usedNames.add(name);

                        horses.push({
                            id: `${ownerId}_f_${i}`,
                            ownerId,
                            name,
                            sex: '牝',
                            distance: femaleDists[i],
                            style: femaleStyles[i],
                            isUnruly: i === unrulyFemaleIdx,
                            baseMin: 13,
                            baseMax: 18,
                            wins: 0,
                            wonRaceNames: [],
                            lastRaceWeek: null
                        });
                    }
                }
                return horses;
            }

            // ==========================================
            // 3. ルーム作成・参加・開始
            // ==========================================
            async createRoom() {
                const nameInput = document.getElementById('owner-name-input');
                const stableSelect = document.getElementById('owner-stable-select');
                const modeSelect = document.querySelector('input[name="game-mode"]:checked');
                const cpuCheckbox = document.getElementById('enable-cpu-checkbox');

                const ownerName = (nameInput?.value || '').trim() || 'オーナー1';
                const stable = stableSelect?.value || '美浦';
                const mode = modeSelect?.value || 'classic';
                const enableCpu = cpuCheckbox ? cpuCheckbox.checked : true;
                const includeFillies = GAME_MODES[mode].includeFillies;

                const newRoomId = this.generateRoomId();
                const initialData = {
                    roomId: newRoomId,
                    hostId: this.playerId,
                    mode,
                    enableCpu,
                    phase: 'lobby',
                    raceIndex: 0,
                    players: [
                        {
                            id: this.playerId,
                            name: ownerName,
                            stable,
                            isCpu: false,
                            color: PLAYER_COLORS[0],
                            money: 10000,
                            wins: 0,
                            wonRaceNames: [],
                            horses: this.generateStableHorses(this.playerId, ownerName, includeFillies),
                            inventory: JSON.parse(JSON.stringify(INITIAL_JOCKEY_ITEMS)),
                            equipped: { '騎手': null, '装備': null, '調教': null },
                            selectedHorseId: null,
                            paddockReady: false,
                            auctionBid: null,
                            auctionBidAt: null
                        }
                    ],
                    auction: null,
                    raceState: null,
                    lastRaceResult: null,
                    finalAwards: []
                };

                this.roomId = newRoomId;
                this.subscribeToRoom(newRoomId);
                await this.saveRoomData(newRoomId, initialData);
                this.showToast(`ルーム（ID: ${newRoomId}）を作成しました！`, 'success');
            }

            async joinRoom() {
                const nameInput = document.getElementById('join-owner-name-input');
                const stableSelect = document.getElementById('join-owner-stable-select');
                const roomInput = document.getElementById('join-room-id-input');

                const ownerName = (nameInput?.value || '').trim() || 'ゲストオーナー';
                const stable = stableSelect?.value || '栗東';
                const targetRoomId = (roomInput?.value || '').trim();

                if (!targetRoomId) {
                    this.showToast('6桁の部屋IDを入力してください。', 'error');
                    return;
                }

                let existingData = null;
                if (firebaseDb) {
                    try {
                        const doc = await firebaseDb.collection('rooms').doc(targetRoomId).get();
                        if (doc.exists) {
                            existingData = doc.data();
                        }
                    } catch (err) {
                        console.warn('Firestoreルーム検索エラー:', err);
                    }
                }

                if (!existingData) {
                    const localRaw = localStorage.getItem('tdd_room_' + targetRoomId);
                    if (localRaw) {
                        existingData = JSON.parse(localRaw);
                    }
                }

                if (!existingData) {
                    this.showToast('指定された部屋IDが見つかりませんでした。', 'error');
                    return;
                }

                if (existingData.phase !== 'lobby') {
                    this.showToast('すでにレース・ツアーが進行中の部屋です。', 'error');
                    return;
                }

                const alreadyJoined = existingData.players.some(p => p.id === this.playerId);
                if (!alreadyJoined) {
                    if (existingData.players.length >= 4) {
                        this.showToast('ルームが満員（最大4人）です。', 'error');
                        return;
                    }
                    const includeFillies = GAME_MODES[existingData.mode]?.includeFillies || false;
                    existingData.players.push({
                        id: this.playerId,
                        name: ownerName,
                        stable,
                        isCpu: false,
                        color: PLAYER_COLORS[existingData.players.length],
                        money: 10000,
                        wins: 0,
                        wonRaceNames: [],
                        horses: this.generateStableHorses(this.playerId, ownerName, includeFillies),
                        inventory: JSON.parse(JSON.stringify(INITIAL_JOCKEY_ITEMS)),
                        equipped: { '騎手': null, '装備': null, '調教': null },
                        selectedHorseId: null,
                        paddockReady: false,
                        auctionBid: null,
                        auctionBidAt: null
                    });
                }

                this.roomId = targetRoomId;
                this.subscribeToRoom(targetRoomId);
                await this.saveRoomData(targetRoomId, existingData);
                this.showToast(`ルーム ${targetRoomId} に参加しました！`, 'success');
            }

            async leaveRoom() {
                this.stopRaceLoop();
                if (this.unsubscribeRoom) {
                    this.unsubscribeRoom();
                    this.unsubscribeRoom = null;
                }
                this.roomId = null;
                this.roomData = null;
                this.renderGame();
            }

            async toggleCpuSetting(enabled) {
                if (!this.roomData || this.roomData.hostId !== this.playerId || this.roomData.phase !== 'lobby') return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                data.enableCpu = enabled;
                await this.saveRoomData(this.roomId, data);
            }

            async startGame() {
                if (!this.roomData || this.roomData.hostId !== this.playerId) return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const includeFillies = GAME_MODES[data.mode].includeFillies;
                const shouldFillCpu = data.enableCpu !== false;

                if (shouldFillCpu) {
                    const cpuNames = ['社台オーナー(CPU)', 'ノーザン社長(CPU)', '個人大馬主(CPU)'];
                    const cpuStables = ['栗東', '美浦', '栗東'];
                    let cpuIdx = 0;

                    while (data.players.length < 4) {
                        const cpuId = 'cpu_' + (data.players.length + 1);
                        const cName = cpuNames[cpuIdx] || `CPUオーナー${data.players.length + 1}`;
                        const cStable = cpuStables[cpuIdx % cpuStables.length];
                        cpuIdx++;

                        data.players.push({
                            id: cpuId,
                            name: cName,
                            stable: cStable,
                            isCpu: true,
                            color: PLAYER_COLORS[data.players.length],
                            money: 10000,
                            wins: 0,
                            wonRaceNames: [],
                            horses: this.generateStableHorses(cpuId, cName, includeFillies),
                            inventory: JSON.parse(JSON.stringify(INITIAL_JOCKEY_ITEMS)),
                            equipped: { '騎手': null, '装備': null, '調教': null },
                            selectedHorseId: null,
                            paddockReady: false,
                            auctionBid: null,
                            auctionBidAt: null
                        });
                    }
                }

                data.raceIndex = 0;
                this.setupAuctionPhase(data);
                await this.saveRoomData(this.roomId, data);
            }

            // ==========================================
            // 4. オークションフェーズ処理
            // ==========================================
            setupAuctionPhase(data) {
                const isUltimate = Boolean(GAME_MODES[data.mode]?.includeFillies);
                const availableItems = ITEM_CATALOG.filter(item => !item.ultimateOnly || isUltimate);
                const pickedItems = shuffleArray(availableItems).slice(0, 2);
                data.phase = 'auction';
                data.auction = {
                    items: pickedItems,
                    itemIndex: 0,
                    history: []
                };
                data.players.forEach(p => {
                    p.auctionBid = null;
                    p.auctionBidAt = null;
                });
                this.bidAmount = 0;
            }

            async submitBid(amount) {
                if (!this.roomData || this.roomData.phase !== 'auction') return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const me = data.players.find(p => p.id === this.playerId);
                if (!me || me.auctionBid !== null) return;

                const safeAmount = Math.max(0, Math.min(me.money, Number(amount) || 0));
                me.auctionBid = safeAmount;
                me.auctionBidAt = Date.now();
                this.bidAmount = 0;

                this.processAuctionProgress(data);
                await this.saveRoomData(this.roomId, data);
            }

            processAuctionProgress(data) {
                if (!data || data.phase !== 'auction' || !data.auction) return;
                const auc = data.auction;
                const currentItem = auc.items[auc.itemIndex];

                // CPUの入札を決定（人間プレイヤーの入札後に処理されるためタイムスタンプも後ろに設定）
                data.players.forEach((p, idx) => {
                    if (p.isCpu && p.auctionBid === null) {
                        if (p.money >= 2000 && Math.random() < 0.7) {
                            const steps = Math.min(Math.floor(p.money / 1000), Math.floor(1 + Math.random() * 3));
                            p.auctionBid = steps * 1000;
                        } else {
                            p.auctionBid = 0;
                        }
                        p.auctionBidAt = Date.now() + idx + 1;
                    }
                });

                // 全員入札完了したら落札判定（同額の場合は先に入札確定したプレイヤーが優先）
                if (data.players.every(p => p.auctionBid !== null)) {
                    let highestBid = 0;
                    let winners = [];

                    data.players.forEach(p => {
                        if (p.auctionBid > highestBid) {
                            highestBid = p.auctionBid;
                            winners = [p];
                        } else if (p.auctionBid === highestBid && highestBid > 0) {
                            winners.push(p);
                        }
                    });

                    let resultText = '該当者なし（流札）';
                    if (winners.length > 0 && highestBid > 0) {
                        winners.sort((a, b) => (a.auctionBidAt || Number.MAX_SAFE_INTEGER) - (b.auctionBidAt || Number.MAX_SAFE_INTEGER));
                        const winner = winners[0];
                        const isTieBreak = winners.length > 1;
                        winner.money -= highestBid;
                        winner.inventory.push(JSON.parse(JSON.stringify(currentItem)));
                        resultText = isTieBreak
                            ? `${winner.name} が ${formatMoney(highestBid)} で落札！（同額・先着優先）`
                            : `${winner.name} が ${formatMoney(highestBid)} で落札！`;
                    }

                    auc.history.push({
                        item: currentItem,
                        result: resultText
                    });

                    data.players.forEach(p => {
                        p.auctionBid = null;
                        p.auctionBidAt = null;
                    });

                    if (auc.itemIndex + 1 < auc.items.length) {
                        auc.itemIndex += 1;
                    } else {
                        this.setupPaddockPhase(data);
                    }
                }
            }

            // ==========================================
            // 5. パドック・出走準備フェーズ処理
            // ==========================================
            setupPaddockPhase(data) {
                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];
                data.phase = 'paddock';
                data.players.forEach(p => {
                    p.paddockReady = false;
                    const eligibleHorses = p.horses.filter(h => !race.fillyOnly || h.sex === '牝');
                    const currentSelected = eligibleHorses.find(h => h.id === p.selectedHorseId);
                    p.selectedHorseId = currentSelected ? currentSelected.id : (eligibleHorses[0]?.id || p.horses[0]?.id || null);
                });
            }

            async selectHorse(horseId) {
                if (!this.roomData || this.roomData.phase !== 'paddock') return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const me = data.players.find(p => p.id === this.playerId);
                if (!me || me.paddockReady) return;
                const nextHorse = me.horses.find(h => h.id === horseId);
                if (!nextHorse) return;
                me.selectedHorseId = horseId;

                // 性別制限のある装備が新しい出走馬の性別と合わない場合は自動的に外して所持品へ戻す
                ['騎手', '装備', '調教'].forEach(cat => {
                    const eq = me.equipped?.[cat];
                    if (eq && eq.sexRestriction && eq.sexRestriction !== nextHorse.sex) {
                        me.inventory.push(eq);
                        me.equipped[cat] = null;
                        this.showToast(`「${eq.name}」は${eq.sexRestriction}馬限定装備のため解除しました。`, 'info');
                    }
                });

                await this.saveRoomData(this.roomId, data);
            }

            async equipItem(invIndex) {
                if (!this.roomData || this.roomData.phase !== 'paddock') return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const me = data.players.find(p => p.id === this.playerId);
                if (!me || me.paddockReady) return;
                const item = me.inventory[invIndex];
                if (!item) return;

                const selectedHorse = me.horses.find(h => h.id === me.selectedHorseId) || me.horses[0];
                if (item.sexRestriction && selectedHorse && selectedHorse.sex !== item.sexRestriction) {
                    this.showToast(`「${item.name}」は${item.sexRestriction}馬限定装備のため装着できません。`, 'error');
                    return;
                }

                if (me.equipped[item.category]) {
                    me.inventory.push(me.equipped[item.category]);
                }
                me.equipped[item.category] = item;
                me.inventory.splice(invIndex, 1);
                await this.saveRoomData(this.roomId, data);
            }

            async unequipItem(category) {
                if (!this.roomData || this.roomData.phase !== 'paddock') return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const me = data.players.find(p => p.id === this.playerId);
                if (!me || me.paddockReady || !me.equipped[category]) return;

                me.inventory.push(me.equipped[category]);
                me.equipped[category] = null;
                await this.saveRoomData(this.roomId, data);
            }

            async confirmPaddockReady() {
                if (!this.roomData || this.roomData.phase !== 'paddock') return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const me = data.players.find(p => p.id === this.playerId);
                if (!me || me.paddockReady) return;

                me.paddockReady = true;
                this.processPaddockProgress(data);
                await this.saveRoomData(this.roomId, data);
            }

            processPaddockProgress(data) {
                if (!data || data.phase !== 'paddock') return;
                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];

                data.players.forEach(p => {
                    if (p.isCpu && !p.paddockReady) {
                        const eligible = p.horses.filter(h => !race.fillyOnly || h.sex === '牝');
                        const freshEligible = eligible.filter(h => !getFatigueInfo(h, race).isFatigued);
                        const pool = freshEligible.length > 0 ? freshEligible : eligible;
                        const chosen = pool[Math.floor(Math.random() * pool.length)] || p.horses[0];
                        p.selectedHorseId = chosen.id;

                        ['騎手', '装備', '調教'].forEach(cat => {
                            if (!p.equipped[cat] && p.inventory.length > 0) {
                                const idx = p.inventory.findIndex(it => it.category === cat && (!it.sexRestriction || it.sexRestriction === chosen.sex));
                                if (idx !== -1 && Math.random() < 0.6) {
                                    p.equipped[cat] = p.inventory[idx];
                                    p.inventory.splice(idx, 1);
                                }
                            }
                        });
                        p.paddockReady = true;
                    }
                });

                if (data.players.every(p => p.paddockReady)) {
                    this.setupRacePhase(data);
                }
            }

            setupRacePhase(data) {
                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];
                const maxTurns = Math.max(1, Math.round(race.distance / 100));

                const runners = data.players.map(p => {
                    const horse = p.horses.find(h => h.id === p.selectedHorseId) || p.horses[0];
                    return {
                        playerId: p.id,
                        playerName: p.name,
                        playerColor: p.color,
                        horseId: horse.id,
                        horseName: horse.name,
                        sex: horse.sex,
                        progress: 0,
                        lastRoll: null,
                        lastMoved: false
                    };
                });

                data.phase = 'racing';
                data.raceState = {
                    turn: 0,
                    maxTurns,
                    isStarted: false,
                    runners,
                    commentary: `${race.name}（${race.track}・芝${race.distance}m）全馬ゲートイン完了！発走をお待ちください。`
                };
            }

            getStageForTurn(turn, trackName, maxTurns) {
                const profile = TRACK_PROFILES[trackName] || TRACK_PROFILES['阪神競馬場'];
                const ratio = Math.min(1, Math.max(0, turn / Math.max(1, maxTurns)));
                const t1 = profile.early;
                const t2 = t1 + profile.mid;
                const t3 = t2 + profile.late;

                if (ratio <= t1) return { key: 'early', label: '序盤' };
                if (ratio <= t2) return { key: 'mid', label: '中盤' };
                if (ratio <= t3) return { key: 'late', label: '終盤' };
                return { key: 'final', label: '最終盤' };
            }

            // ==========================================
            // 6. レース進行・能力計算・写真判定
            // ==========================================
            getRunnerAbilityBreakdown(player, horse, race, stageKey, data = this.roomData) {
                const eqList = ['騎手', '装備', '調教'].map(cat => player.equipped?.[cat]).filter(Boolean);
                const hasItem = (id) => eqList.some(it => it.id === id);

                let distShift = 0;
                if (hasItem('j_ikezoe')) distShift += 1;
                if (hasItem('t_hanro')) distShift += 1;
                if (hasItem('t_shorten')) distShift -= 1;

                const effectiveHorseDist = shiftDistanceCategory(horse.distance, distShift);
                const raceDistCat = getDistanceCategory(race.distance);
                const diffSteps = getDistanceDiffPenalty(effectiveHorseDist, raceDistCat);
                const isDistMatch = diffSteps === 0;

                let distLabel = `適性:${effectiveHorseDist}`;
                if (distShift !== 0) {
                    distLabel += `(${horse.distance}${distShift > 0 ? `+${distShift}` : distShift})`;
                }
                distLabel += isDistMatch ? ' ◎一致' : ` ${raceDistCat}戦 -${diffSteps}`;

                const styleBonusObj = STYLE_STAGE_BONUSES[horse.style] || { early: 0, mid: 0, late: 0, final: 0 };
                const styleBonus = styleBonusObj[stageKey] || 0;
                const isStyleActive = styleBonus > 0;
                const styleLabel = isStyleActive ? `${horse.style}(+${styleBonus})` : `${horse.style}`;

                const cancelUnruly = hasItem('j_yokoyama_n') || hasItem('e_menko');
                let unrulyStatus = null;
                if (horse.isUnruly) {
                    unrulyStatus = cancelUnruly ? '気性難(打消済)' : '気性難(+3/-5)';
                }

                const stableInfo = STABLES[player.stable];
                const isHomeTrack = stableInfo ? stableInfo.homeTracks.includes(race.track) : true;
                const awayBlocked = hasItem('t_local');
                let awayStatus = null;
                if (!isHomeTrack) {
                    awayStatus = awayBlocked ? '遠征(現地追いで無効化)' : '遠征(最大-2)';
                }

                const growthBonus = Math.max(0, Number(horse.wins || 0));
                const fatigue = getFatigueInfo(horse, race);
                const fatigueBlocked = hasItem('t_pool') || hasItem('e_gold_carrot');
                const fatigueBlockSource = hasItem('e_gold_carrot') ? '金のニンジン' : 'プール調教';

                // 他出走馬との性別相互作用チェック（魅惑の髪飾り・漢義レース鞍）
                const otherPlayers = (data?.players || []).filter(p => p.id !== player.id);
                const otherRunnersInfo = otherPlayers.map(op => {
                    const oh = op.horses.find(h => h.id === op.selectedHorseId) || op.horses[0];
                    const oEq = ['騎手', '装備', '調教'].map(cat => op.equipped?.[cat]).filter(Boolean);
                    return { horse: oh, eqList: oEq };
                });

                const charmedByCount = horse.sex === '牡'
                    ? otherRunnersInfo.filter(o => o.horse?.sex === '牝' && o.eqList.some(it => it.id === 'e_hairpin')).length
                    : 0;
                const otokogiActive = horse.sex === '牡' && hasItem('e_saddle') && otherRunnersInfo.some(o => o.horse?.sex === '牝');

                return {
                    isDistMatch,
                    distLabel,
                    isStyleActive,
                    styleLabel,
                    unrulyStatus,
                    cancelUnruly,
                    awayStatus,
                    awayBlocked,
                    growthBonus,
                    fatigue,
                    fatigueBlocked,
                    fatigueBlockSource,
                    charmedByCount,
                    otokogiActive,
                    equippedList: eqList
                };
            }

            calculateDiceRange(player, horse, race, stageKey, data = this.roomData) {
                const eqList = ['騎手', '装備', '調教'].map(cat => player.equipped?.[cat]).filter(Boolean);
                const hasItem = (id) => eqList.some(it => it.id === id);

                let minVal = horse.baseMin;
                let maxVal = horse.baseMax + Math.max(0, Number(horse.wins || 0));

                // 連戦疲労デバフ（前回出走から3週間以内は最大値・最小値を-2、プール調教・金のニンジン装備時は無効化）
                const fatigue = getFatigueInfo(horse, race);
                if (fatigue.isFatigued && !hasItem('t_pool') && !hasItem('e_gold_carrot')) {
                    minVal -= 2;
                    maxVal -= 2;
                }

                // 距離適性のズレによるペナルティ（1ズレで-1、2ズレで-2、3ズレで-3）
                let distShift = 0;
                if (hasItem('j_ikezoe')) distShift += 1;
                if (hasItem('t_hanro')) distShift += 1;
                if (hasItem('t_shorten')) distShift -= 1;

                const effectiveHorseDist = shiftDistanceCategory(horse.distance, distShift);
                const raceDistCat = getDistanceCategory(race.distance);
                const diffSteps = getDistanceDiffPenalty(effectiveHorseDist, raceDistCat);
                if (diffSteps > 0) {
                    minVal -= diffSteps;
                    maxVal -= diffSteps;
                }

                // 脚質×展開ボーナス
                const styleBonusObj = STYLE_STAGE_BONUSES[horse.style] || { early: 0, mid: 0, late: 0, final: 0 };
                const sBonus = styleBonusObj[stageKey] || 0;
                if (sBonus > 0) {
                    minVal += sBonus;
                    maxVal += sBonus;
                }

                // 気性難効果
                if (horse.isUnruly) {
                    const cancelMinus = hasItem('j_yokoyama_n') || hasItem('e_menko');
                    maxVal += 3;
                    if (!cancelMinus) {
                        minVal -= 5;
                    }
                }

                // 遠征ペナルティ
                const stableInfo = STABLES[player.stable];
                const isHomeTrack = stableInfo ? stableInfo.homeTracks.includes(race.track) : true;
                if (!isHomeTrack && !hasItem('t_local')) {
                    maxVal -= 2;
                }

                // 他馬との性別相互作用効果（魅惑の髪飾り・漢義レース鞍）
                const otherPlayers = (data?.players || []).filter(p => p.id !== player.id);
                const otherRunnersInfo = otherPlayers.map(op => {
                    const oh = op.horses.find(h => h.id === op.selectedHorseId) || op.horses[0];
                    const oEq = ['騎手', '装備', '調教'].map(cat => op.equipped?.[cat]).filter(Boolean);
                    return { horse: oh, eqList: oEq };
                });

                // 魅惑の髪飾り：他の競走馬のうち牡馬のみの出目の最大値をマイナス2する
                if (horse.sex === '牡') {
                    const hairpinUsers = otherRunnersInfo.filter(o => o.horse?.sex === '牝' && o.eqList.some(it => it.id === 'e_hairpin')).length;
                    if (hairpinUsers > 0) {
                        maxVal -= 2 * hairpinUsers;
                    }
                }

                // 漢義レース鞍：他の競走馬に牝馬が混じっている場合、出目の最大値をプラス5、最小値をマイナス5する
                if (horse.sex === '牡' && hasItem('e_saddle')) {
                    const hasOtherFilly = otherRunnersInfo.some(o => o.horse?.sex === '牝');
                    if (hasOtherFilly) {
                        maxVal += 5;
                        minVal -= 5;
                    }
                }

                // 騎手・装備・調教アイテム効果
                if (hasItem('j_fukunaga') && horse.sex === '牝') {
                    minVal += 3;
                    maxVal += 3;
                }
                if (hasItem('j_sakai') && horse.style === '逃げ') {
                    minVal += 3;
                    maxVal += 3;
                }
                if (hasItem('j_kawada') && horse.style === '先行') {
                    minVal += 3;
                    maxVal += 3;
                }
                if (hasItem('j_lemaire') && horse.style === '差し') {
                    minVal += 3;
                    maxVal += 3;
                }
                if (hasItem('j_take') && horse.style === '追込み') {
                    minVal += 3;
                    maxVal += 3;
                }
                if (hasItem('j_shibata')) {
                    minVal += 4;
                }
                if (hasItem('j_yokoyama_t') && raceDistCat === '短距離') {
                    minVal += 3;
                    maxVal += 3;
                }
                if (hasItem('j_tosaki') && raceDistCat === 'マイル') {
                    minVal += 3;
                    maxVal += 3;
                }
                if (hasItem('j_demuro') && raceDistCat === '中距離') {
                    minVal += 3;
                    maxVal += 3;
                }
                if (hasItem('j_ebina') && raceDistCat === '長距離') {
                    minVal += 3;
                    maxVal += 3;
                }
                if (hasItem('e_horseshoe')) {
                    minVal += 3;
                }
                if (hasItem('e_whip')) {
                    maxVal += 3;
                    minVal -= 2;
                }
                if (hasItem('e_brush')) {
                    maxVal += 1;
                    minVal += 2;
                }
                if (hasItem('e_feed')) {
                    maxVal += 2;
                }
                if (hasItem('t_gate') && stageKey === 'early') {
                    maxVal += 3;
                }
                if (hasItem('t_course') && stageKey === 'final') {
                    maxVal += 3;
                }

                if (maxVal < minVal) {
                    maxVal = minVal;
                }

                return { min: minVal, max: maxVal };
            }

            rollInRange(minVal, maxVal) {
                const low = Math.min(minVal, maxVal);
                const high = Math.max(minVal, maxVal);
                return Math.floor(low + Math.random() * (high - low + 1));
            }

            async startRace() {
                if (!this.roomData || this.roomData.hostId !== this.playerId || this.roomData.phase !== 'racing') return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                data.raceState.isStarted = true;
                data.raceState.commentary = 'ゲートオープン！オート進行スタートしました！';
                await this.saveRoomData(this.roomId, data);
                this.startRaceLoop();
            }

            async advanceRaceTurn() {
                if (!this.roomData || this.roomData.hostId !== this.playerId || this.roomData.phase !== 'racing' || this.isProcessing) return;
                this.isProcessing = true;
                try {
                    const data = JSON.parse(JSON.stringify(this.roomData));
                    const rs = data.raceState;
                    const races = this.getActiveRaces(data);
                    const race = races[data.raceIndex];

                    rs.turn += 1;
                    const stage = this.getStageForTurn(rs.turn, race.track, rs.maxTurns);
                    const meters = rs.turn * 100;

                    let highestRoll = -Infinity;
                    rs.runners.forEach(runner => {
                        const player = data.players.find(p => p.id === runner.playerId);
                        const horse = player.horses.find(h => h.id === runner.horseId);
                        const range = this.calculateDiceRange(player, horse, race, stage.key, data);
                        const roll = this.rollInRange(range.min, range.max);
                        runner.lastRoll = roll;
                        runner.lastMoved = false;
                        if (roll > highestRoll) {
                            highestRoll = roll;
                        }
                    });

                    const movedNames = [];
                    rs.runners.forEach(runner => {
                        if (runner.lastRoll === highestRoll) {
                            runner.progress += 1;
                            runner.lastMoved = true;
                            movedNames.push(runner.horseName);
                        }
                    });

                    rs.commentary = `${meters}m地点（${stage.label}）：最大出目 ${highestRoll} で ${movedNames.join('・')} が1マス前進！`;

                    if (rs.turn >= rs.maxTurns) {
                        this.stopRaceLoop();
                        this.finalizeRace(data);
                    }

                    await this.saveRoomData(this.roomId, data);
                } finally {
                    this.isProcessing = false;
                }
            }

            finalizeRace(data) {
                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];
                const rs = data.raceState;
                const photoFinishLogs = [];
                const photoFinishHorseIds = new Set();

                // 累計マス数でグループ化し、同着があれば最終盤の出目レンジで決着ダイス
                const groupedByProgress = new Map();
                rs.runners.forEach(runner => {
                    if (!groupedByProgress.has(runner.progress)) {
                        groupedByProgress.set(runner.progress, []);
                    }
                    groupedByProgress.get(runner.progress).push(runner);
                });

                const sortedProgressKeys = [...groupedByProgress.keys()].sort((a, b) => b - a);
                const finalOrderedRunners = [];

                sortedProgressKeys.forEach(prog => {
                    const group = groupedByProgress.get(prog);
                    if (group.length === 1) {
                        finalOrderedRunners.push(group[0]);
                        return;
                    }

                    group.forEach(g => photoFinishHorseIds.add(g.horseId));
                    let round = 1;
                    let contenders = [...group];

                    while (contenders.length > 1 && round <= 10) {
                        const entries = contenders.map(c => {
                            const player = data.players.find(p => p.id === c.playerId);
                            const horse = player.horses.find(h => h.id === c.horseId);
                            const range = this.calculateDiceRange(player, horse, race, 'final', data);
                            const roll = this.rollInRange(range.min, range.max);
                            return {
                                runner: c,
                                horseName: c.horseName,
                                min: range.min,
                                max: range.max,
                                roll
                            };
                        });

                        photoFinishLogs.push({
                            progress: prog,
                            round,
                            entries: entries.map(e => ({
                                horseName: e.horseName,
                                min: e.min,
                                max: e.max,
                                roll: e.roll
                            }))
                        });

                        const maxTieRoll = Math.max(...entries.map(e => e.roll));
                        const topGroup = entries.filter(e => e.roll === maxTieRoll).map(e => e.runner);
                        const restGroup = entries.filter(e => e.roll < maxTieRoll).sort((a, b) => b.roll - a.roll).map(e => e.runner);

                        if (topGroup.length === 1) {
                            finalOrderedRunners.push(topGroup[0]);
                            contenders = restGroup;
                            if (contenders.length === 1) {
                                finalOrderedRunners.push(contenders[0]);
                                contenders = [];
                            }
                        } else {
                            contenders = topGroup;
                        }
                        round++;
                    }

                    if (contenders.length > 0) {
                        finalOrderedRunners.push(...contenders);
                    }
                });

                const standings = finalOrderedRunners.map((runner, idx) => {
                    const rank = idx + 1;
                    const player = data.players.find(p => p.id === runner.playerId);
                    const horse = player.horses.find(h => h.id === runner.horseId);
                    const basePrize = race.prizes[idx] || 0;
                    const kobanApplied = player.equipped?.['装備']?.id === 'e_koban' && basePrize > 0;
                    const prize = kobanApplied ? basePrize * 2 : basePrize;

                    // 連戦疲労判定用に今回レースの開催週を記録
                    horse.lastRaceWeek = getAbsoluteWeek(race.age, race.month, race.week);

                    player.money += prize;
                    if (rank === 1) {
                        player.wins += 1;
                        player.wonRaceNames.push(race.name);
                        horse.wins = (horse.wins || 0) + 1;
                        horse.wonRaceNames = horse.wonRaceNames || [];
                        horse.wonRaceNames.push(race.name);
                    }

                    // 装着アイテムはレース終了後に消費
                    player.equipped = { '騎手': null, '装備': null, '調教': null };

                    return {
                        rank,
                        playerId: player.id,
                        playerName: player.name,
                        horseId: horse.id,
                        horseName: horse.name,
                        progress: runner.progress,
                        prize,
                        kobanApplied,
                        hadPhotoFinish: photoFinishHorseIds.has(horse.id)
                    };
                });

                data.lastRaceResult = {
                    race,
                    standings,
                    photoFinishLogs
                };
                data.phase = 'result';
            }

            async goToNextRace() {
                if (!this.roomData || this.roomData.hostId !== this.playerId) return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const races = this.getActiveRaces(data);

                if (data.raceIndex + 1 < races.length) {
                    data.raceIndex += 1;
                    this.setupAuctionPhase(data);
                } else {
                    this.calculateFinalAwards(data);
                    data.phase = 'awards';
                }
                await this.saveRoomData(this.roomId, data);
            }

            calculateFinalAwards(data) {
                const awards = [];
                const allHorses = [];
                data.players.forEach(p => {
                    p.horses.forEach(h => {
                        allHorses.push({ player: p, horse: h });
                    });
                });

                // 1. 最多勝利オーナー（+5億円 / 同率1位は該当する全オーナーにそれぞれ+5億円）
                const maxOwnerWins = Math.max(0, ...data.players.map(p => p.wins || 0));
                if (maxOwnerWins > 0) {
                    const topOwners = data.players.filter(p => (p.wins || 0) === maxOwnerWins);
                    topOwners.forEach(p => { p.money += 50000; });
                    awards.push({
                        title: '👑 最多勝利オーナー',
                        prize: 50000,
                        winners: topOwners.map(p => `${p.name}（G1 ${maxOwnerWins}勝）`).join(' / ')
                    });
                }

                // 2. 最優秀競走馬（+5億円 / 同率1位は該当する全競走馬を表記し、各所有オーナーに+5億円）
                const maxWins = Math.max(0, ...allHorses.map(x => x.horse.wins || 0));
                if (maxWins > 0) {
                    const topHorses = allHorses.filter(x => (x.horse.wins || 0) === maxWins);
                    topHorses.forEach(x => { x.player.money += 50000; });
                    awards.push({
                        title: '🏅 最優秀競走馬',
                        prize: 50000,
                        winners: topHorses.map(x => `${x.horse.name}（オーナー: ${x.player.name}・${maxWins}勝）`).join(' / ')
                    });
                }

                // 3. 同一競走馬による路線制覇・三冠アワード定義
                const routeChallenges = [
                    {
                        title: '⚡ スプリントの覇者',
                        prize: 30000,
                        requiredRaces: ['高松宮記念', 'スプリンターズS']
                    },
                    {
                        title: '👑 マイルの皇帝',
                        prize: 30000,
                        requiredRaces: ['安田記念', 'マイルチャンピオンシップ']
                    },
                    {
                        title: '🏆 牡馬クラシック3冠',
                        prize: 50000,
                        requiredRaces: ['皐月賞', '日本ダービー', '菊花賞']
                    },
                    {
                        title: '🌸 牝馬クラシック3冠',
                        prize: 30000,
                        requiredRaces: ['桜花賞', 'オークス', '秋華賞']
                    },
                    {
                        title: '👸 牝馬路線完全制覇',
                        prize: 70000,
                        requiredRaces: ['阪神ジュベナイルフィリーズ', '桜花賞', 'オークス', '秋華賞', 'ヴィクトリアマイル', 'エリザベス女王杯']
                    },
                    {
                        title: '🌱 春古馬3冠',
                        prize: 50000,
                        requiredRaces: ['大阪杯', '天皇賞（春）', '宝塚記念']
                    },
                    {
                        title: '🍁 秋古馬3冠',
                        prize: 50000,
                        requiredRaces: ['天皇賞（秋）', 'ジャパンカップ', '有馬記念']
                    }
                ];

                routeChallenges.forEach(ch => {
                    const achievers = allHorses.filter(x => {
                        const won = x.horse.wonRaceNames || [];
                        return ch.requiredRaces.every(rName => won.includes(rName));
                    });
                    if (achievers.length > 0) {
                        achievers.forEach(x => { x.player.money += ch.prize; });
                        awards.push({
                            title: ch.title,
                            prize: ch.prize,
                            winners: achievers.map(x => `${x.horse.name}（オーナー: ${x.player.name}）`).join(' / ')
                        });
                    }
                });

                data.finalAwards = awards;
            }

            startRaceLoop() {
                this.stopRaceLoop();
                this.raceInterval = setInterval(() => {
                    if (
                        this.roomData &&
                        this.roomData.hostId === this.playerId &&
                        this.roomData.phase === 'racing' &&
                        this.roomData.raceState?.isStarted
                    ) {
                        this.advanceRaceTurn();
                    } else {
                        this.stopRaceLoop();
                    }
                }, 3000);
            }

            stopRaceLoop() {
                if (this.raceInterval) {
                    clearInterval(this.raceInterval);
                    this.raceInterval = null;
                }
            }

            // ==========================================
            // 7. 画面描画（ルーター＆各フェーズ）
            // ==========================================
            renderGame() {
                const mainEl = document.getElementById('main-content');
                const headerStatusEl = document.getElementById('header-status');
                if (!mainEl) return;

                if (!this.roomData) {
                    this.stopRaceLoop();
                    if (headerStatusEl) {
                        headerStatusEl.innerHTML = `<span class="text-xs text-emerald-300 font-bold">ロビー未参加</span>`;
                    }
                    mainEl.innerHTML = this.renderTitleScreen();
                    return;
                }

                const data = this.roomData;
                const me = data.players.find(p => p.id === this.playerId);

                if (data.phase === 'racing' && data.raceState?.isStarted && data.hostId === this.playerId && !this.raceInterval) {
                    this.startRaceLoop();
                } else if (data.phase !== 'racing') {
                    this.stopRaceLoop();
                }

                if (headerStatusEl) {
                    headerStatusEl.innerHTML = `
                        <span class="bg-emerald-900 border border-emerald-600 px-2.5 py-1 rounded-lg font-bold text-emerald-200">
                            部屋ID: <strong class="text-amber-300">${data.roomId}</strong>
                        </span>
                        ${me ? `
                            <span class="bg-slate-900 border border-amber-500/50 px-2.5 py-1 rounded-lg font-black text-amber-300">
                                💰 ${formatMoney(me.money)}
                            </span>
                        ` : ''}
                        <button onclick="window.gameApp.leaveRoom()"
                            class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 px-2.5 py-1 rounded-lg text-xs font-bold">
                            退出
                        </button>
                    `;
                }

                switch (data.phase) {
                    case 'lobby':
                        mainEl.innerHTML = this.renderLobby(data);
                        break;
                    case 'auction':
                        mainEl.innerHTML = this.renderAuction(data);
                        break;
                    case 'paddock':
                        mainEl.innerHTML = this.renderPaddock(data);
                        break;
                    case 'racing':
                        mainEl.innerHTML = this.renderRacing(data);
                        break;
                    case 'result':
                        mainEl.innerHTML = this.renderRaceResult(data);
                        break;
                    case 'awards':
                        mainEl.innerHTML = this.renderFinalAwards(data);
                        break;
                    default:
                        mainEl.innerHTML = this.renderLobby(data);
                }
            }

                                                            <select onchange="window.gameApp.updateHorseMemo('${h.id}', 'style', this.value)"

                                                                <option value="" ${memo.unruly === '' ? 'selected' : ''}>未記入</option>

                                    <h4 class="text-xs font-black text-emerald-300">所持アイテム一覧</h4>
                                    ${me.inventory && me.inventory.length > 0 ? `
                                        <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
                                            ${me.inventory.map((item, idx) => {

                        </div>

            }

            renderRacing(data) {
                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];
                const rs = data.raceState;
                const isHost = data.hostId === this.playerId;
                const isSecret = this.isSecretMode(data);
                const isStarted = Boolean(rs.isStarted);
                const nextTurn = Math.min(rs.maxTurns, rs.turn + 1);
                const nextStage = this.getStageForTurn(nextTurn, race.track, rs.maxTurns);
                const currentStage = rs.turn === 0 ? nextStage : this.getStageForTurn(rs.turn, race.track, rs.maxTurns);
                const maxProg = Math.max(rs.maxTurns, ...rs.runners.map(r => r.progress + 1));

                const currentMeters = rs.turn * 100;
                const nextMeters = nextTurn * 100;

                return `
                    <div class="max-w-5xl mx-auto space-y-5">

                                ${isStarted ? `
                                    <span class="inline-flex items-center gap-1.5 text-emerald-300">
                                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>

                                    </span>
                                ` : `
                                    <span class="text-amber-300">ゲート待機中</span>
                                `}

                        </div>

                        <!-- レース実況ヘッダー -->
                        <div class="turf-pattern border border-emerald-600 rounded-2xl p-4 sm:p-5 shadow-xl">

                                    <span class="bg-amber-500 text-slate-950 text-xs font-black px-3 py-1 rounded-full">

                                    </span>
                                    ${isSecret ? '<span class="bg-purple-700 text-purple-100 text-xs font-black px-2.5 py-1 rounded-full border border-purple-400/50">🕵️ 裏モード：出目から能力推理中</span>' : ''}
                                </div>
                                <span class="text-xs font-bold text-emerald-200">${race.name}（${race.track}・芝${race.distance}m）</span>
                            </div>
                            <p class="text-base sm:text-lg font-black text-white bg-slate-950/60 px-4 py-2.5 rounded-xl border border-emerald-700/60">
                                🎙️ ${rs.commentary}
                            </p>
                        </div>

                        <!-- レース開始前：ゲートオープン（開始ボタン）エリア -->
                        ${!isStarted ? `
                            <div class="bg-gradient-to-r from-amber-950/90 via-slate-900 to-amber-950/90 border-2 border-amber-400 rounded-2xl p-5 text-center shadow-2xl space-y-3">

                                    <button onclick="window.gameApp.startRace()"
                                        class="w-full sm:w-auto px-10 py-4 bg-gradient-to-r from-amber-400 via-amber-500 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 font-black text-lg sm:text-xl rounded-2xl shadow-xl transition transform active:scale-95">

                                    </button>

                                    <div class="inline-block bg-slate-800 border border-amber-500/50 text-amber-300 text-sm font-bold px-5 py-3 rounded-xl animate-pulse">
                                        ホストが「レース開始」ボタンを押すのを待っています...
                                    </div>
                                `}
                            </div>
                        ` : ''}

                        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4 sm:p-5 space-y-4">
                            ${rs.runners.map(runner => {
                                const player = data.players.find(p => p.id === runner.playerId);
                                const horse = player.horses.find(h => h.id === runner.horseId);
                                const currentRange = this.calculateDiceRange(player, horse, race, nextStage.key, data);
                                const ability = this.getRunnerAbilityBreakdown(player, horse, race, nextStage.key, data);
                                const pct = Math.min(92, Math.round((runner.progress / maxProg) * 90));
                                const bashinDiff = topProgress - runner.progress;
                                const bashinLabel = rs.turn === 0
                                    ? 'スタート前'
                                    : (bashinDiff === 0 ? '👑 先頭' : `先頭から ${bashinDiff}馬身差`);

                                return `
                                    <div class="bg-slate-800/90 border ${runner.lastMoved ? 'border-amber-400/80 ring-1 ring-amber-400/40' : 'border-slate-700'} rounded-xl p-3.5 space-y-2.5 transition">

                                                <span class="text-xs text-slate-400">（${runner.playerName}）</span>
                                            </div>
                                            <div class="flex flex-wrap items-center gap-2">
                                                ${!isSecret ? `
                                                    <span class="bg-indigo-950 border border-indigo-500/60 text-indigo-200 text-xs font-bold px-2.5 py-1 rounded-lg">
                                                        📊 出目: ${currentRange.min}〜${currentRange.max}
                                                    </span>
                                                ` : `
                                                    <span class="bg-purple-950/90 border border-purple-500/50 text-purple-200 text-xs font-bold px-2.5 py-1 rounded-lg">
                                                        🕵️ 出目レンジ: ???
                                                    </span>
                                                `}
                                                ${runner.lastRoll !== null ? `

                                                        🎲 出目 ${runner.lastRoll} ${runner.lastMoved ? '（+1マス前進！）' : ''}

                                                    ${bashinLabel}
                                                </span>
                                                <span class="text-sm font-black text-emerald-400 min-w-[68px] text-right">
                                                    ${runner.progress}マス
                                                </span>
                                            </div>
                                        </div>

                                        <!-- 発動能力・装備アイテムの可視化バッジ -->
                                        <div class="flex flex-wrap items-center gap-1.5 text-[11px] bg-slate-950/60 border border-slate-700/80 rounded-lg px-2.5 py-2">

                                                <span class="px-2 py-0.5 rounded font-bold bg-amber-500/20 text-amber-300 border border-amber-400/50">
