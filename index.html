            const idx = DIST_CATEGORIES.indexOf(baseCat);
            if (idx === -1) return baseCat;
            const nextIdx = Math.max(0, Math.min(DIST_CATEGORIES.length - 1, idx + shift));

            let totalWeeks = age * 52;
            for (let m = 1; m < month; m++) {

        // 初期配布用・基本騎手アイテム4種（オークション対象外・各オーナー初期所持）
        const INITIAL_JOCKEY_ITEMS = [
            { id: 'init_j_nige', category: '騎手', name: '逃げの名手', desc: '競走馬の脚質が逃げの場合、出目の最大値と最小値をプラス1する。' },

        ];

        const HORSE_WORDS_MALE = ['インパクト', 'キング', 'サンデー', 'ブラック', 'ゴールド', 'シップ', 'ネイア', 'カナロア', 'スズカ', 'ルドルフ', 'テイオー', 'ブライアン', 'フェスタ', 'ヴァーミリオン', 'クロフネ', 'オペラオー'];
        const HORSE_WORDS_FEMALE = ['クイーン', 'アイ', 'ドンナ', 'アレグリア', 'アイランド', 'ジェネシス', 'ビスタ', 'スカーレット', 'グルーヴ', 'ローズ', 'タクト', 'ホワイト', 'ウオッカ', 'ソダシ', 'アパパネ', 'ブエナ'];

        function formatMoney(manYen) {
            if (manYen === 0) return '0万円';
            const oku = Math.floor(manYen / 10000);
            const man = manYen % 10000;
            if (oku > 0 && man > 0) return `${oku}億${man.toLocaleString()}万円`;
            if (oku > 0) return `${oku}億円`;
            return `${man.toLocaleString()}万円`;
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // ==========================================
        // 2. メインゲームクラス
        // ==========================================
        class TurfDiceDerby {
            constructor() {
                this.roomId = null;
                this.playerId = this.getOrCreatePlayerId();
                this.roomData = null;
                this.unsubscribeRoom = null;
                this.selectedHorseId = null;
                this.bidAmount = 0;
                this.isProcessing = false;
                this.raceInterval = null;
                this.horseMemos = {};
                this.isCloudSynced = false;
                this.paddockStageTab = 'early';
            }

            setPaddockStageTab(stageKey) {
                this.paddockStageTab = stageKey;
                this.renderGame();
            }

            adjustBidAmount(delta, maxBid) {
                const next = Math.max(0, Math.min(maxBid, (Number(this.bidAmount) || 0) + delta));
                this.bidAmount = next;
                this.renderGame();
            }

            resetBidAmount() {
                this.bidAmount = 0;
                this.renderGame();
            }

            isSecretMode(data = this.roomData) {
                const modeKey = data?.mode || 'classic';
                return Boolean(GAME_MODES[modeKey]?.isSecret);
            }

            getHorseMemo(horseId) {
                return this.horseMemos[horseId] || { distance: '', style: '', unruly: '' };
            }

            updateHorseMemo(horseId, field, value) {
                if (!this.horseMemos[horseId]) {
                    this.horseMemos[horseId] = { distance: '', style: '', unruly: '' };
                }
                this.horseMemos[horseId][field] = value;
                this.renderGame();
            }

            getOrCreatePlayerId() {
                let id = sessionStorage.getItem('tdd_player_id');
                if (!id) {
                    id = 'player_' + Math.random().toString(36).substring(2, 10);
                    sessionStorage.setItem('tdd_player_id', id);
                }
                return id;
            }

            generateRoomId() {
                return Math.floor(100000 + Math.random() * 900000).toString();
            }

            showToast(msg, type = 'info') {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const el = document.createElement('div');
                const colors = {
                    info: 'bg-emerald-900 border-emerald-500 text-white',
                    success: 'bg-amber-900 border-amber-400 text-amber-100',
                    error: 'bg-red-900 border-red-500 text-white'
                };
                el.className = `${colors[type] || colors.info} border px-4 py-3 rounded-xl shadow-xl text-sm font-bold transition-all duration-300`;
                el.textContent = msg;
                container.appendChild(el);
                setTimeout(() => {
                    el.style.opacity = '0';
                    setTimeout(() => el.remove(), 300);
                }, 3200);
            }

            getActiveRaces(data = this.roomData) {
                const modeKey = data?.mode || 'classic';
                return (GAME_MODES[modeKey] || GAME_MODES.classic).races;
            }

            // Firestore & LocalStorage 同期保存
            async saveRoomData(roomId, data) {
                this.roomData = data;
                localStorage.setItem('tdd_room_' + roomId, JSON.stringify(data));
                this.renderGame();

                if (firebaseDb) {
                    try {
                        await ensureFirebaseAuth();
                        await firebaseDb.collection('rooms').doc(roomId).set(data);
                        this.isCloudSynced = true;
                        return true;
                    } catch (err) {
                        console.error('Firestore保存エラー:', err);
                        this.isCloudSynced = false;
                        return false;
                    }
                }
                return false;
            }

            async subscribeToRoom(roomId) {
                if (this.unsubscribeRoom) {
                    this.unsubscribeRoom();
                    this.unsubscribeRoom = null;
                }
                if (firebaseDb) {
                    await ensureFirebaseAuth();
                    this.unsubscribeRoom = firebaseDb.collection('rooms').doc(roomId).onSnapshot((doc) => {
                        if (doc.exists) {
                            const incoming = doc.data();
                            this.isCloudSynced = true;
                            this.roomData = incoming;
                            this.handleHostAutoProgress(incoming);
                            this.renderGame();
                        }
                    }, (err) => {
                        console.error('Firestoreリアルタイム同期エラー:', err);
                        this.isCloudSynced = false;
                        this.showToast(`リアルタイム受信エラー: ${err.message || err.code}`, 'error');
                    });
                } else {
                    window.addEventListener('storage', (e) => {
                        if (e.key === 'tdd_room_' + roomId && e.newValue) {
                            const incoming = JSON.parse(e.newValue);
                            this.roomData = incoming;
                            this.handleHostAutoProgress(incoming);
                            this.renderGame();
                        }
                    });
                }
            }

            async handleHostAutoProgress(incomingData) {
                if (!incomingData || incomingData.hostId !== this.playerId || this.isProcessing) return;

                if (incomingData.phase === 'auction' && incomingData.auction && !incomingData.auction.isFinished) {
                    const needsCpu = incomingData.players.some(p => p.isCpu && p.auctionBid === null);
                    const allBid = incomingData.players.every(p => p.auctionBid !== null);
                    if (needsCpu || allBid) {
                        this.isProcessing = true;
                        try {
                            const copy = JSON.parse(JSON.stringify(incomingData));
                            this.processAuctionProgress(copy);
                            await this.saveRoomData(this.roomId, copy);
                        } finally {
                            this.isProcessing = false;
                        }
                    }
                } else if (incomingData.phase === 'paddock') {
                    const needsCpu = incomingData.players.some(p => p.isCpu && !p.paddockReady);
                    const allReady = incomingData.players.every(p => p.paddockReady);
                    if (needsCpu || allReady) {
                        this.isProcessing = true;
                        try {
                            const copy = JSON.parse(JSON.stringify(incomingData));
                            this.processPaddockProgress(copy);
                            await this.saveRoomData(this.roomId, copy);
                        } finally {
                            this.isProcessing = false;
                        }
                    }
                }
            }

            generateStableHorses(ownerId, ownerName, includeFillies = false) {
                const horses = [];
                const maleDists = shuffleArray(DIST_CATEGORIES);
                const maleStyles = shuffleArray(STYLES);
                const unrulyMaleIdx = Math.floor(Math.random() * 4);
                const usedNames = new Set();

                const cleanCrown = (ownerName || 'オーナー').replace(/\(CPU\)$/i, '').trim() || 'オーナー';
                const buildHorseName = (baseWord) => {
                    return Math.random() < 0.5 ? `${cleanCrown}${baseWord}` : `${baseWord}${cleanCrown}`;
                };

                for (let i = 0; i < 4; i++) {
                    let name = '';
                    let attempts = 0;
                    do {
                        const baseWord = HORSE_WORDS_MALE[Math.floor(Math.random() * HORSE_WORDS_MALE.length)];
                        name = buildHorseName(baseWord);
                        attempts++;
                    } while (usedNames.has(name) && attempts < 50);
                    usedNames.add(name);

                    horses.push({
                        id: `${ownerId}_m_${i}`,
                        ownerId,
                        name,
                        sex: '牡',
                        distance: maleDists[i],
                        style: maleStyles[i],
                        isUnruly: i === unrulyMaleIdx,
                        baseMin: 10,
                        baseMax: 20,
                        wins: 0,
                        wonRaceNames: [],
                        lastRaceWeek: null
                    });
                }

                if (includeFillies) {
                    const femaleDists = shuffleArray(DIST_CATEGORIES);
                    const femaleStyles = shuffleArray(STYLES);
                    const unrulyFemaleIdx = Math.floor(Math.random() * 4);

                    for (let i = 0; i < 4; i++) {
                        let name = '';
                        let attempts = 0;
                        do {
                            const baseWord = HORSE_WORDS_FEMALE[Math.floor(Math.random() * HORSE_WORDS_FEMALE.length)];
                            name = buildHorseName(baseWord);
                            attempts++;
                        } while (usedNames.has(name) && attempts < 50);
                        usedNames.add(name);

                        horses.push({
                            id: `${ownerId}_f_${i}`,
                            ownerId,
                            name,
                            sex: '牝',
                            distance: femaleDists[i],
                            style: femaleStyles[i],
                            isUnruly: i === unrulyFemaleIdx,
                            baseMin: 13,
                            baseMax: 18,
                            wins: 0,
                            wonRaceNames: [],
                            lastRaceWeek: null
                        });
                    }
                }
                return horses;
            }

            // ==========================================
            // 3. ルーム作成・参加・開始
            // ==========================================
            async createRoom() {
                const nameInput = document.getElementById('owner-name-input');
                const stableSelect = document.getElementById('owner-stable-select');
                const modeSelect = document.querySelector('input[name="game-mode"]:checked');
                const cpuCheckbox = document.getElementById('enable-cpu-checkbox');

                const ownerName = (nameInput?.value || '').trim() || 'オーナー1';
                const stable = stableSelect?.value || '美浦';
                const mode = modeSelect?.value || 'classic';
                const enableCpu = cpuCheckbox ? cpuCheckbox.checked : true;
                const includeFillies = GAME_MODES[mode].includeFillies;

                const newRoomId = this.generateRoomId();
                const initialData = {
                    roomId: newRoomId,
                    hostId: this.playerId,
                    mode,
                    enableCpu,
                    auctionItemCount: 2,
                    phase: 'lobby',
                    raceIndex: 0,
                    players: [
                        {
                            id: this.playerId,
                            name: ownerName,
                            stable,
                            isCpu: false,
                            color: PLAYER_COLORS[0],
                            money: 10000,
                            wins: 0,
                            wonRaceNames: [],
                            horses: this.generateStableHorses(this.playerId, ownerName, includeFillies),
                            inventory: JSON.parse(JSON.stringify(INITIAL_JOCKEY_ITEMS)),
                            equipped: { '騎手': null, '装備': null, '調教': null },
                            selectedHorseId: null,
                            paddockReady: false,
                            auctionBid: null,
                            auctionBidAt: null
                        }
                    ],
                    auction: null,
                    raceState: null,
                    lastRaceResult: null,
                    finalAwards: []
                };

                this.roomId = newRoomId;
                sessionStorage.setItem('tdd_last_room_id', newRoomId);
                await this.subscribeToRoom(newRoomId);
                const synced = await this.saveRoomData(newRoomId, initialData);
                if (synced) {
                    this.showToast(`オンラインルーム（ID: ${newRoomId}）を作成しました！`, 'success');
                } else {
                    this.showToast(`ローカルルーム（ID: ${newRoomId}）を作成しました`, 'info');
                }
            }

            async joinRoom() {
                const nameInput = document.getElementById('join-owner-name-input');
                const stableSelect = document.getElementById('join-owner-stable-select');
                const roomInput = document.getElementById('join-room-id-input');

                const ownerName = (nameInput?.value || '').trim() || 'ゲストオーナー';
                const stable = stableSelect?.value || '美浦';
                const targetRoomId = (roomInput?.value || '').trim();

                if (!targetRoomId) {
                    this.showToast('6桁の部屋IDを入力してください。', 'error');
                    return;
                }

                let existingData = null;
                if (firebaseDb) {
                    try {
                        await ensureFirebaseAuth();
                        const doc = await firebaseDb.collection('rooms').doc(targetRoomId).get();
                        if (doc.exists) {
                            existingData = doc.data();
                            this.isCloudSynced = true;
                        }
                    } catch (err) {
                        console.error('Firestoreルーム検索エラー:', err);
                        this.showToast(`部屋検索エラー: ${err.code || err.message}`, 'error');
                    }
                }

                if (!existingData) {
                    const localRaw = localStorage.getItem('tdd_room_' + targetRoomId);
                    if (localRaw) {
                        existingData = JSON.parse(localRaw);
                    }
                }

                if (!existingData) {
                    this.showToast('指定された部屋IDが見つかりませんでした。', 'error');
                    return;
                }

                const alreadyJoined = existingData.players.some(p => p.id === this.playerId);
                if (!alreadyJoined && existingData.phase !== 'lobby') {
                    this.showToast('すでにレース・ツアーが進行中の部屋です。', 'error');
                    return;
                }

                if (!alreadyJoined) {
                    if (existingData.players.length >= 4) {
                        this.showToast('ルームが満員（最大4人）です。', 'error');
                        return;
                    }
                    const modeKey = existingData.mode || 'classic';
                    const includeFillies = Boolean(GAME_MODES[modeKey]?.includeFillies);
                    existingData.players.push({
                        id: this.playerId,
                        name: ownerName,
                        stable,
                        isCpu: false,
                        color: PLAYER_COLORS[existingData.players.length % PLAYER_COLORS.length],
                        money: 10000,
                        wins: 0,
                        wonRaceNames: [],
                        horses: this.generateStableHorses(this.playerId, ownerName, includeFillies),
                        inventory: JSON.parse(JSON.stringify(INITIAL_JOCKEY_ITEMS)),
                        equipped: { '騎手': null, '装備': null, '調教': null },
                        selectedHorseId: null,
                        paddockReady: false,
                        auctionBid: null,
                        auctionBidAt: null
                    });
                }

                this.roomId = targetRoomId;
                sessionStorage.setItem('tdd_last_room_id', targetRoomId);
                await this.subscribeToRoom(targetRoomId);
                if (firebaseDb) {
                    try {
                        await firebaseDb.runTransaction(async (tx) => {
                            const docRef = firebaseDb.collection('rooms').doc(targetRoomId);
                            const snap = await tx.get(docRef);
                            if (!snap.exists) return;
                            const latest = snap.data();
                            if (!latest.players.some(p => p.id === this.playerId) && latest.players.length < 4 && latest.phase === 'lobby') {
                                const myEntry = existingData.players.find(p => p.id === this.playerId);
                                if (myEntry) {
                                    myEntry.color = PLAYER_COLORS[latest.players.length % PLAYER_COLORS.length];
                                    latest.players.push(myEntry);
                                    tx.set(docRef, latest);
                                }
                            }
                            this.roomData = latest;
                        });
                    } catch (txErr) {
                        console.error('参加トランザクションエラー（既存データで復帰します）:', txErr);
                        this.roomData = existingData;
                    }
                } else {
                    await this.saveRoomData(targetRoomId, existingData);
                }
                this.showToast(alreadyJoined ? `ルーム ${targetRoomId} に途中復帰しました！` : `ルーム ${targetRoomId} に参加しました！`, 'success');
                this.renderGame();
            }

            async toggleCpuSetting(enabled) {
                if (!this.roomData || this.roomData.hostId !== this.playerId || this.roomData.phase !== 'lobby') return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                data.enableCpu = enabled;
                await this.saveRoomData(this.roomId, data);
            }

            async setAuctionItemCount(count) {
                if (!this.roomData || this.roomData.hostId !== this.playerId || this.roomData.phase !== 'lobby') return;
                const validCount = Math.max(1, Math.min(3, Number(count) || 2));
                const data = JSON.parse(JSON.stringify(this.roomData));
                data.auctionItemCount = validCount;
                await this.saveRoomData(this.roomId, data);
            }

            async startGame() {
                if (!this.roomData || this.roomData.hostId !== this.playerId) return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const includeFillies = GAME_MODES[data.mode].includeFillies;
                const shouldFillCpu = data.enableCpu !== false;

                if (shouldFillCpu) {
                    const cpuNames = ['社台オーナー(CPU)', 'ノーザン社長(CPU)', '個人大馬主(CPU)'];
                    const cpuStables = ['栗東', '美浦', '栗東'];
                    let cpuIdx = 0;

                    while (data.players.length < 4) {
                        const cpuId = 'cpu_' + (data.players.length + 1);
                        const cName = cpuNames[cpuIdx] || `CPUオーナー${data.players.length + 1}`;
                        const cStable = cpuStables[cpuIdx % cpuStables.length];
                        cpuIdx++;

                        data.players.push({
                            id: cpuId,
                            name: cName,
                            stable: cStable,
                            isCpu: true,
                            color: PLAYER_COLORS[data.players.length],
                            money: 10000,
                            wins: 0,
                            wonRaceNames: [],
                            horses: this.generateStableHorses(cpuId, cName, includeFillies),
                            inventory: JSON.parse(JSON.stringify(INITIAL_JOCKEY_ITEMS)),
                            equipped: { '騎手': null, '装備': null, '調教': null },
                            selectedHorseId: null,
                            paddockReady: false,
                            auctionBid: null,
                            auctionBidAt: null
                        });
                    }
                }

                data.raceIndex = 0;
                this.setupAuctionPhase(data);
                await this.saveRoomData(this.roomId, data);
            }

            // ==========================================
            // 4. オークションフェーズ処理
            // ==========================================
            setupAuctionPhase(data) {
                const isUltimate = Boolean(GAME_MODES[data.mode]?.includeFillies);
                const availableItems = ITEM_CATALOG.filter(item => !item.ultimateOnly || isUltimate);
                const itemCount = Math.max(1, Math.min(3, Number(data.auctionItemCount) || 2));
                const pickedItems = shuffleArray(availableItems).slice(0, Math.min(itemCount, availableItems.length));
                data.phase = 'auction';
                data.auction = {
                    items: pickedItems,
                    itemIndex: 0,
                    history: [],
                    isFinished: false
                };
                data.players.forEach(p => {
                    p.auctionBid = null;
                    p.auctionBidAt = null;
                });
                this.bidAmount = 0;
            }

            processAuctionProgress(data) {
                const auc = data.auction;
                if (!auc || auc.isFinished) return;
                const currentItem = auc.items[auc.itemIndex];
                if (!currentItem) {
                    auc.isFinished = true;
                    return;
                }

                // CPU自動入札
                data.players.forEach(p => {
                    if (p.isCpu && p.auctionBid === null) {
                        const maxAffordable = Math.floor(p.money / 1000) * 1000;
                        if (maxAffordable < 1000 || Math.random() < 0.35) {
                            p.auctionBid = 0;
                        } else {
                            const maxCap = Math.min(maxAffordable, 4000);
                            const steps = Math.floor(maxCap / 1000);
                            p.auctionBid = (Math.floor(Math.random() * steps) + 1) * 1000;
                        }
                        p.auctionBidAt = Date.now() + Math.floor(Math.random() * 500);
                    }
                });

                const allBid = data.players.every(p => p.auctionBid !== null);
                if (!allBid) return;

                // 全員の入札明細を記録（高額順・同額は先着優先）
                const bidDetails = data.players
                    .map(p => ({
                        playerId: p.id,
                        playerName: p.name,
                        amount: p.auctionBid || 0,
                        bidAt: p.auctionBidAt || Number.MAX_SAFE_INTEGER
                    }))
                    .sort((a, b) => (b.amount - a.amount) || (a.bidAt - b.bidAt));

                const highestBid = bidDetails[0]?.amount || 0;
                let resultText = '入札なし（流れ）';
                let winnerId = null;

                if (highestBid > 0) {
                    const topBidders = bidDetails.filter(b => b.amount === highestBid);
                    const winnerEntry = topBidders[0];
                    const winner = data.players.find(p => p.id === winnerEntry.playerId);
                    if (winner) {
                        winner.money = Math.max(0, winner.money - highestBid);
                        winner.inventory.push(JSON.parse(JSON.stringify(currentItem)));
                        winnerId = winner.id;
                        const tieNote = topBidders.length > 1 ? '（同額・先着優先）' : '';
                        resultText = `${winner.name} が ${formatMoney(highestBid)} で落札！${tieNote}`;
                    }
                }

                auc.history.push({
                    item: currentItem,
                    result: resultText,
                    winnerId,
                    bids: bidDetails.map(({ playerId, playerName, amount }) => ({ playerId, playerName, amount }))
                });

                if (auc.itemIndex + 1 < auc.items.length) {
                    auc.itemIndex += 1;
                    data.players.forEach(p => {
                        p.auctionBid = null;
                        p.auctionBidAt = null;
                    });
                } else {
                    auc.isFinished = true;
                    data.players.forEach(p => {
                        p.auctionBid = null;
                        p.auctionBidAt = null;
                    });
                }
            }

            async proceedFromAuctionToPaddock() {
                if (!this.roomData || this.roomData.hostId !== this.playerId || this.isProcessing) return;
                this.isProcessing = true;
                try {
                    const data = JSON.parse(JSON.stringify(this.roomData));
                    this.setupPaddockPhase(data);
                    await this.saveRoomData(this.roomId, data);
                } finally {
                    this.isProcessing = false;
                }
            }

            async submitBid(amount) {
                if (!this.roomData || this.roomData.phase !== 'auction' || this.roomData.auction?.isFinished || this.isProcessing) return;
                this.isProcessing = true;
                try {
                    if (firebaseDb) {
                        await ensureFirebaseAuth();
                        const docRef = firebaseDb.collection('rooms').doc(this.roomId);
                        await firebaseDb.runTransaction(async (tx) => {
                            const snap = await tx.get(docRef);
                            if (!snap.exists) return;
                            const latest = snap.data();
                            if (latest.phase !== 'auction' || latest.auction?.isFinished) return;

                            const me = latest.players.find(p => p.id === this.playerId);
                            if (!me || me.auctionBid !== null) return;

                            const validBid = Math.max(0, Math.min(me.money, Number(amount) || 0));
                            me.auctionBid = validBid;
                            me.auctionBidAt = Date.now();

                            if (latest.hostId === this.playerId) {
                                this.processAuctionProgress(latest);
                            }

                            tx.set(docRef, latest);
                            this.roomData = latest;
                        });
                        this.isCloudSynced = true;
                    } else {
                        const data = JSON.parse(JSON.stringify(this.roomData));
                        const me = data.players.find(p => p.id === this.playerId);
                        if (!me || me.auctionBid !== null) return;

                        const validBid = Math.max(0, Math.min(me.money, Number(amount) || 0));
                        me.auctionBid = validBid;
                        me.auctionBidAt = Date.now();
                        this.processAuctionProgress(data);
                        await this.saveRoomData(this.roomId, data);
                    }
                    this.bidAmount = 0;
                    this.renderGame();
                } finally {
                    this.isProcessing = false;
                }
            }

            // ==========================================
            // 5. パドック（出走馬＆装備選択）処理
            // ==========================================
            setupPaddockPhase(data) {
                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];
                data.phase = 'paddock';
                data.players.forEach(p => {
                    p.paddockReady = false;
                    const eligibleHorses = p.horses.filter(h => !race.fillyOnly || h.sex === '牝');
                    const fallbackHorse = eligibleHorses[0] || p.horses[0];
                    if (!p.selectedHorseId || !eligibleHorses.some(h => h.id === p.selectedHorseId)) {
                        p.selectedHorseId = fallbackHorse.id;
                    }
                    const currentHorse = p.horses.find(h => h.id === p.selectedHorseId);
                    if (currentHorse && p.equipped) {
                        ['騎手', '装備', '調教'].forEach(cat => {
                            const eq = p.equipped[cat];
                            if (eq && eq.sexRestriction && currentHorse.sex !== eq.sexRestriction) {
                                p.inventory.push(eq);
                                p.equipped[cat] = null;
                            }
                        });
                    }
                });
            }

            processPaddockProgress(data) {
                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];
                const raceDistCat = getDistanceCategory(race.distance);

                data.players.forEach(p => {
                    if (p.isCpu && !p.paddockReady) {
                        const eligible = p.horses.filter(h => !race.fillyOnly || h.sex === '牝');
                        const bestHorse = eligible.find(h => h.distance === raceDistCat) || eligible[0];
                        p.selectedHorseId = bestHorse.id;

                        ['騎手', '装備', '調教'].forEach(cat => {
                            const idx = p.inventory.findIndex(it => it.category === cat && (!it.sexRestriction || bestHorse.sex === it.sexRestriction));
                            if (idx !== -1 && !p.equipped[cat]) {
                                p.equipped[cat] = p.inventory.splice(idx, 1)[0];
                            }
                        });
                        p.paddockReady = true;
                    }
                });

                const allReady = data.players.every(p => p.paddockReady);
                if (allReady) {
                    this.setupRacePhase(data);
                }
            }

            selectHorse(horseId) {
                if (!this.roomData || this.roomData.phase !== 'paddock') return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const me = data.players.find(p => p.id === this.playerId);
                if (!me || me.paddockReady) return;

                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];
                const targetHorse = me.horses.find(h => h.id === horseId);
                if (!targetHorse) return;
                if (race.fillyOnly && targetHorse.sex !== '牝') {
                    this.showToast('このレースは牝馬限定戦です！', 'error');
                    return;
                }

                me.selectedHorseId = horseId;

                if (me.equipped) {
                    ['騎手', '装備', '調教'].forEach(cat => {
                        const eq = me.equipped[cat];
                        if (eq && eq.sexRestriction && targetHorse.sex !== eq.sexRestriction) {
                            me.inventory.push(eq);
                            me.equipped[cat] = null;
                            this.showToast(`「${eq.name}」は${eq.sexRestriction}馬限定のため外れました。`, 'info');
                        }
                    });
                }

                this.roomData = data;
                this.renderGame();
            }

            equipItem(inventoryIndex) {
                if (!this.roomData || this.roomData.phase !== 'paddock') return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const me = data.players.find(p => p.id === this.playerId);
                if (!me || me.paddockReady) return;

                const item = me.inventory[inventoryIndex];
                if (!item) return;

                const selectedHorse = me.horses.find(h => h.id === me.selectedHorseId) || me.horses[0];
                if (item.sexRestriction && selectedHorse && selectedHorse.sex !== item.sexRestriction) {
                    this.showToast(`「${item.name}」は${item.sexRestriction}馬限定装備です！`, 'error');
                    return;
                }

                const cat = item.category;
                if (me.equipped[cat]) {
                    me.inventory.push(me.equipped[cat]);
                }
                me.equipped[cat] = me.inventory.splice(inventoryIndex, 1)[0];

                this.roomData = data;
                this.renderGame();
            }

            unequipItem(category) {
                if (!this.roomData || this.roomData.phase !== 'paddock') return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const me = data.players.find(p => p.id === this.playerId);
                if (!me || me.paddockReady || !me.equipped[category]) return;

                me.inventory.push(me.equipped[category]);
                me.equipped[category] = null;

                this.roomData = data;
                this.renderGame();
            }

            async confirmPaddockReady() {
                if (!this.roomData || this.roomData.phase !== 'paddock' || this.isProcessing) return;
                this.isProcessing = true;
                try {
                    if (firebaseDb) {
                        await ensureFirebaseAuth();
                        const docRef = firebaseDb.collection('rooms').doc(this.roomId);
                        await firebaseDb.runTransaction(async (tx) => {
                            const snap = await tx.get(docRef);
                            if (!snap.exists) return;
                            const latest = snap.data();
                            if (latest.phase !== 'paddock') return;

                            const me = latest.players.find(p => p.id === this.playerId);
                            if (!me || me.paddockReady) return;

                            const localMe = this.roomData.players.find(p => p.id === this.playerId);
                            if (localMe) {
                                me.selectedHorseId = localMe.selectedHorseId;
                                me.equipped = localMe.equipped;
                                me.inventory = localMe.inventory;
                            }
                            me.paddockReady = true;

                            if (latest.hostId === this.playerId) {
                                this.processPaddockProgress(latest);
                            }

                            tx.set(docRef, latest);
                            this.roomData = latest;
                        });
                        this.isCloudSynced = true;
                    } else {
                        const data = JSON.parse(JSON.stringify(this.roomData));
                        const me = data.players.find(p => p.id === this.playerId);
                        if (!me || me.paddockReady) return;
                        me.paddockReady = true;
                        this.processPaddockProgress(data);
                        await this.saveRoomData(this.roomId, data);
                    }
                    this.renderGame();
                } finally {
                    this.isProcessing = false;
                }
            }

            // ==========================================
            // 6. レース進行＆計算ロジック
            // ==========================================
            getStageForTurn(turn, trackName, maxTurns) {
                const profile = TRACK_PROFILES[trackName] || TRACK_PROFILES['東京競馬場'];
                const earlyEnd = Math.max(1, Math.round(maxTurns * profile.early));
                const midEnd = Math.max(earlyEnd + 1, Math.round(maxTurns * (profile.early + profile.mid)));
                const lateEnd = Math.max(midEnd + 1, Math.round(maxTurns * (profile.early + profile.mid + profile.late)));

                if (turn <= earlyEnd) return { key: 'early', label: '序盤' };
                if (turn <= midEnd) return { key: 'mid', label: '中盤' };
                if (turn <= lateEnd) return { key: 'late', label: '終盤' };
                return { key: 'final', label: '最終盤' };
            }

            getRunnerAbilityBreakdown(player, horse, race, stageKey, data = this.roomData) {
                let min = horse.baseMin;
                let max = horse.baseMax;
                const jockey = player.equipped?.['騎手'];
                const gear = player.equipped?.['装備'];
                const train = player.equipped?.['調教'];

                // 勝利数による成長補正（1勝ごとに最大値+1、最大+3）
                const growthBonus = Math.min(3, horse.wins || 0);
                max += growthBonus;

                // 適正距離判定（1カテゴリズレる毎に最大値・最小値を -1）
                let effectiveHorseDist = horse.distance;
                if (jockey?.id === 'j_ikezoe') effectiveHorseDist = shiftDistanceCategory(effectiveHorseDist, 1);
                if (train?.id === 't_hanro') effectiveHorseDist = shiftDistanceCategory(effectiveHorseDist, 1);
                if (train?.id === 't_shorten') effectiveHorseDist = shiftDistanceCategory(effectiveHorseDist, -1);

                const raceDistCat = getDistanceCategory(race.distance);
                const distDiff = getDistanceDiffPenalty(effectiveHorseDist, raceDistCat);
                const isDistMatch = distDiff === 0;
                if (distDiff > 0) {
                    min -= distDiff;
                    max -= distDiff;
                }
                const distLabel = effectiveHorseDist !== horse.distance
                    ? `適性:${horse.distance}→${effectiveHorseDist} (${isDistMatch ? '一致' : `${distDiff}ズレ -${distDiff}`})`
                    : `適性:${horse.distance} (${isDistMatch ? '一致' : `${distDiff}ズレ -${distDiff}`})`;

                // 脚質による展開補正
                const styleBonus = STYLE_STAGE_BONUSES[horse.style]?.[stageKey] || 0;
                const isStyleActive = styleBonus > 0;
                if (styleBonus > 0) {
                    min += styleBonus;
                    max += styleBonus;
                }
                const styleLabel = `脚質:${horse.style}${styleBonus > 0 ? ` (+${styleBonus}発動)` : ''}`;

                // 気性難ペナルティ＆爆発力（最大値+3、最小値-5。無効化アイテムで最小-5のみ打ち消し）
                const cancelUnruly = jockey?.id === 'j_yokoyama_n' || gear?.id === 'e_menko';
                let unrulyStatus = null;
                if (horse.isUnruly) {
                    max += 3;
                    if (cancelUnruly) {
                        unrulyStatus = '気性難(最大+3 / 最小デバフ無効化済)';
                    } else {
                        min -= 5;
                        unrulyStatus = '気性難(最大+3 / 最小-5)';
                    }
                }

                // トレセン遠征ペナルティ
                const homeTracks = STABLES[player.stable]?.homeTracks || [];
                const isAway = !homeTracks.includes(race.track);
                const awayBlocked = train?.id === 't_local';
                let awayStatus = null;
                if (isAway) {
                    if (awayBlocked) {
                        awayStatus = '遠征(現地追いで無効化)';
                    } else {
                        max -= 2;
                        awayStatus = '遠征(最大-2)';
                    }
                }

                // 連戦疲労ペナルティ（中3週以内で最大・最小 -2）
                const fatigue = getFatigueInfo(horse, race);
                const fatigueBlocked = train?.id === 't_pool' || gear?.id === 'e_gold_carrot';
                const fatigueBlockSource = gear?.id === 'e_gold_carrot' ? '金のニンジン' : 'プール調教';
                if (fatigue.isFatigued && !fatigueBlocked) {
                    min -= 2;
                    max -= 2;
                }

                // 個別アイテム効果
                if (jockey?.id === 'j_fukunaga' && horse.sex === '牝') { min += 3; max += 3; }
                if (jockey?.id === 'j_sakai' && stageKey === 'early') { min += 3; max += 3; }
                if (jockey?.id === 'j_kawada' && stageKey === 'mid') { min += 3; max += 3; }
                if (jockey?.id === 'j_lemaire' && stageKey === 'late') { min += 3; max += 3; }
                if (jockey?.id === 'j_take' && stageKey === 'final') { min += 3; max += 3; }
                if (jockey?.id === 'j_shibata') { min += 4; }
                if (jockey?.id === 'j_yokoyama_t' && raceDistCat === '短距離') { min += 2; max += 2; }
                if (jockey?.id === 'j_tosaki' && raceDistCat === 'マイル') { min += 2; max += 2; }
                if (jockey?.id === 'j_demuro' && raceDistCat === '中距離') { min += 2; max += 2; }
                if (jockey?.id === 'j_ebina' && raceDistCat === '長距離') { min += 2; max += 2; }

                if (jockey?.id === 'init_j_nige' && horse.style === '逃げ') { min += 1; max += 1; }
                if (jockey?.id === 'init_j_senko' && horse.style === '先行') { min += 1; max += 1; }
                if (jockey?.id === 'init_j_sashi' && horse.style === '差し') { min += 1; max += 1; }
                if (jockey?.id === 'init_j_oikomi' && horse.style === '追込み') { min += 1; max += 1; }

                if (gear?.id === 'e_horseshoe') { min += 3; }
                if (gear?.id === 'e_whip') { max += 3; min -= 2; }
                if (gear?.id === 'e_brush') { max += 1; min += 2; }
                if (gear?.id === 'e_feed') { max += 2; }

                if (train?.id === 't_gate' && stageKey === 'early') { max += 3; }
                if (train?.id === 't_course' && stageKey === 'final') { max += 3; }

                // 他出走馬との相互作用（魅惑の髪飾り / 漢義レース鞍）
                let charmedByCount = 0;
                let otokogiActive = false;
                const playersList = data?.players || [];
                const activeRunners = data?.raceState?.runners || [];

                const otherHorses = playersList
                    .filter(p => p.id !== player.id)
                    .map(p => {
                        const rEntry = activeRunners.find(r => r.playerId === p.id);
                        const hId = rEntry ? rEntry.horseId : p.selectedHorseId;
                        const hObj = p.horses.find(h => h.id === hId) || p.horses[0];
                        return { player: p, horse: hObj };
                    })
                    .filter(x => x.horse);

                if (horse.sex === '牡') {
                    charmedByCount = otherHorses.filter(x => x.player.equipped?.['装備']?.id === 'e_hairpin').length;
                    if (charmedByCount > 0) {
                        max -= 2 * charmedByCount;
                    }
                }

                if (gear?.id === 'e_saddle' && horse.sex === '牡') {
                    const hasFemaleRival = otherHorses.some(x => x.horse.sex === '牝');
                    if (hasFemaleRival) {
                        otokogiActive = true;
                        max += 5;
                        min -= 5;
                    }
                }

                min = Math.max(1, min);
                max = Math.max(min, max);

                const equippedList = [jockey, gear, train].filter(Boolean);

                return {
                    min,
                    max,
                    isDistMatch,
                    distLabel,
                    isStyleActive,
                    styleLabel,
                    unrulyStatus,
                    cancelUnruly,
                    awayStatus,
                    awayBlocked,
                    growthBonus,
                    fatigue,
                    fatigueBlocked,
                    fatigueBlockSource,
                    charmedByCount,
                    otokogiActive,
                    equippedList
                };
            }

            calculateDiceRange(player, horse, race, stageKey, data = this.roomData) {
                const breakdown = this.getRunnerAbilityBreakdown(player, horse, race, stageKey, data);
                return { min: breakdown.min, max: breakdown.max };
            }

            setupRacePhase(data) {
                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];
                const maxTurns = Math.max(1, Math.round(race.distance / 100));

                const runners = data.players.map(p => {
                    const horse = p.horses.find(h => h.id === p.selectedHorseId) || p.horses[0];
                    return {
                        playerId: p.id,
                        playerName: p.name,
                        playerColor: p.color,
                        horseId: horse.id,
                        horseName: horse.name,
                        sex: horse.sex,
                        style: horse.style,
                        progress: 0,
                        lastRoll: null,
                        lastMoved: false
                    };
                });

                data.phase = 'racing';
                data.raceState = {
                    turn: 0,
                    maxTurns,
                    isStarted: false,
                    runners,
                    commentary: `ゲートイン完了！全${maxTurns}ターン（芝${race.distance}m）の決戦が始まります！「レース開始」ボタンを押してください。`
                };
            }

            async startRace() {
                if (!this.roomData || this.roomData.hostId !== this.playerId || this.roomData.phase !== 'racing' || this.isProcessing) return;
                if (this.roomData.raceState?.isStarted) return;

                this.isProcessing = true;
                try {
                    const data = JSON.parse(JSON.stringify(this.roomData));
                    data.raceState.isStarted = true;
                    data.raceState.commentary = '🎺 ファンファーレ高らかにゲートオープン！各馬一斉にスタートしました！';
                    await this.saveRoomData(this.roomId, data);
                    this.startRaceLoop();
                } finally {
                    this.isProcessing = false;
                }
            }

            startRaceLoop() {
                this.stopRaceLoop();
                this.raceInterval = setInterval(() => {
                    if (this.roomData && this.roomData.phase === 'racing' && this.roomData.raceState?.isStarted && this.roomData.hostId === this.playerId) {
                        this.advanceRaceTurn();
                    } else {
                        this.stopRaceLoop();
                    }
                }, 3000);
            }

            stopRaceLoop() {
                if (this.raceInterval) {
                    clearInterval(this.raceInterval);
                    this.raceInterval = null;
                }
            }

            async advanceRaceTurn() {
                if (!this.roomData || this.roomData.hostId !== this.playerId || this.roomData.phase !== 'racing' || this.isProcessing) return;
                if (!this.roomData.raceState?.isStarted) return;
                this.isProcessing = true;

                try {
                    const data = JSON.parse(JSON.stringify(this.roomData));
                    const races = this.getActiveRaces(data);
                    const race = races[data.raceIndex];
                    const rs = data.raceState;

                    rs.turn += 1;
                    const stage = this.getStageForTurn(rs.turn, race.track, rs.maxTurns);

                    const rolls = rs.runners.map(runner => {
                        const player = data.players.find(p => p.id === runner.playerId);
                        const horse = player.horses.find(h => h.id === runner.horseId);
                        const range = this.calculateDiceRange(player, horse, race, stage.key, data);
                        const roll = Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;
                        return { runner, roll };
                    });

                    const maxRoll = Math.max(...rolls.map(x => x.roll));
                    const winners = [];

                    rolls.forEach(({ runner, roll }) => {
                        runner.lastRoll = roll;
                        if (roll === maxRoll) {
                            runner.progress += 1;
                            runner.lastMoved = true;
                            winners.push(runner.horseName);
                        } else {
                            runner.lastMoved = false;
                        }
                    });

                    const currentMeters = rs.turn * 100;
                    rs.commentary = `【${rs.turn}/${rs.maxTurns}ターン・${currentMeters}m地点（${stage.label}）】最大出目「${maxRoll}」を出した ${winners.join(' & ')} が1マス前進！`;

                    if (rs.turn >= rs.maxTurns) {
                        this.stopRaceLoop();
                        this.finalizeRaceResult(data, race);
                    }

                    await this.saveRoomData(this.roomId, data);
                } finally {
                    this.isProcessing = false;
                }
            }

            finalizeRaceResult(data, race) {
                const rs = data.raceState;
                const currentWeek = getAbsoluteWeek(race.age, race.month, race.week);
                const photoFinishLogs = [];
                const photoFinishHorseIds = new Set();

                // 出走馬ごとの累計進捗と最終盤ダイスレンジを準備
                const entries = rs.runners.map(runner => {
                    const player = data.players.find(p => p.id === runner.playerId);
                    const horse = player.horses.find(h => h.id === runner.horseId);
                    const finalRange = this.calculateDiceRange(player, horse, race, 'final', data);
                    return {
                        runner,
                        player,
                        horse,
                        progress: runner.progress,
                        min: finalRange.min,
                        max: finalRange.max,
                        tieBreakerRoll: 0
                    };
                });

                // 同じ累計進捗マスに並んだ馬同士で写真判定（同着決戦ダイス）を実施
                const progressGroups = new Map();
                entries.forEach(ent => {
                    if (!progressGroups.has(ent.progress)) {
                        progressGroups.set(ent.progress, []);
                    }
                    progressGroups.get(ent.progress).push(ent);
                });

                progressGroups.forEach((group, progVal) => {
                    if (group.length <= 1) return;
                    group.forEach(g => photoFinishHorseIds.add(g.horse.id));

                    let round = 1;
                    let contenders = [...group];
                    while (contenders.length > 1 && round <= 10) {
                        const rolled = contenders.map(c => {
                            const roll = Math.floor(Math.random() * (c.max - c.min + 1)) + c.min;
                            c.tieBreakerRoll = roll;
                            return { item: c, roll };
                        });

                        photoFinishLogs.push({
                            progress: progVal,
                            round,
                            entries: rolled.map(({ item, roll }) => ({
                                horseId: item.horse.id,
                                horseName: item.horse.name,
                                playerName: item.player.name,
                                min: item.min,
                                max: item.max,
                                roll
                            }))
                        });

                        const topTieRoll = Math.max(...rolled.map(x => x.roll));
                        const topGroup = rolled.filter(x => x.roll === topTieRoll).map(x => x.item);
                        if (topGroup.length === 1) {
                            break;
                        }
                        contenders = topGroup;
                        round++;
                    }

                    // わずかな差をつけるため同着グループ内で順位順の決着スコアを付与
                    const sortedGroup = [...group].sort((a, b) => b.tieBreakerRoll - a.tieBreakerRoll);
                    sortedGroup.forEach((item, idx) => {
                        item.tieRankOffset = idx;
                    });
                });

                // 最終順位ソート（進捗降順 → 同マス写真判定スコア降順）
                entries.sort((a, b) => {
                    if (b.progress !== a.progress) return b.progress - a.progress;
                    return (a.tieRankOffset || 0) - (b.tieRankOffset || 0);
                });

                const standings = entries.map((ent, index) => {
                    const rank = index + 1;
                    const basePrize = race.prizes[index] || 0;
                    const gear = ent.player.equipped?.['装備'];
                    const kobanApplied = gear?.id === 'e_koban' && basePrize > 0;
                    const prize = kobanApplied ? basePrize * 2 : basePrize;

                    // 賞金・勝利記録・最終出走週を更新
                    ent.player.money += prize;
                    ent.horse.lastRaceWeek = currentWeek;

                    if (rank === 1) {
                        ent.player.wins = (ent.player.wins || 0) + 1;
                        ent.player.wonRaceNames = ent.player.wonRaceNames || [];
                        if (!ent.player.wonRaceNames.includes(race.name)) {
                            ent.player.wonRaceNames.push(race.name);
                        }

                        ent.horse.wins = (ent.horse.wins || 0) + 1;
                        ent.horse.wonRaceNames = ent.horse.wonRaceNames || [];
                        if (!ent.horse.wonRaceNames.includes(race.name)) {
                            ent.horse.wonRaceNames.push(race.name);
                        }
                    }

                    // レース終了時に使用済み（消耗）装備スロットをクリア
                    if (ent.player.equipped) {
                        ent.player.equipped = { '騎手': null, '装備': null, '調教': null };
                    }

                    return {
                        rank,
                        playerId: ent.player.id,
                        playerName: ent.player.name,
                        horseId: ent.horse.id,
                        horseName: ent.horse.name,
                        progress: ent.progress,
                        prize,
                        kobanApplied,
                        hadPhotoFinish: photoFinishHorseIds.has(ent.horse.id)
                    };
                });

                data.lastRaceResult = {
                    race,
                    standings,
                    photoFinishLogs
                };
                data.phase = 'result';
            }

            async goToNextRace() {
                if (!this.roomData || this.roomData.hostId !== this.playerId || this.isProcessing) return;
                this.isProcessing = true;
                try {
                    const data = JSON.parse(JSON.stringify(this.roomData));
                    const races = this.getActiveRaces(data);

                    if (data.raceIndex + 1 >= races.length) {
                        this.calculateFinalAwards(data);
                        data.phase = 'awards';
                    } else {
                        data.raceIndex += 1;
                        data.lastRaceResult = null;
                        data.raceState = null;
                        this.setupAuctionPhase(data);
                    }

                    await this.saveRoomData(this.roomId, data);
                } finally {
                    this.isProcessing = false;
                }
            }

            calculateFinalAwards(data) {
                const awards = [];
                const players = data.players || [];
                if (players.length === 0) {
                    data.finalAwards = awards;
                    return;
                }

                const awardPlayer = (title, prize, winnerPlayers, winnerLabel) => {
                    if (!winnerPlayers || winnerPlayers.length === 0) return;
                    winnerPlayers.forEach(p => {
                        p.money += prize;
                    });
                    awards.push({
                        title,
                        prize,
                        winners: winnerLabel
                    });
                };

                // 1. 最多勝利オーナー（+5億円・同率1位は全員に+5億円）
                const maxOwnerWins = Math.max(0, ...players.map(p => p.wins || 0));
                if (maxOwnerWins > 0) {
                    const topOwners = players.filter(p => (p.wins || 0) === maxOwnerWins);
                    awardPlayer(
                        '👑 最多勝利オーナー',
                        50000,
                        topOwners,
                        `${topOwners.map(p => p.name).join(' / ')}（${maxOwnerWins}勝）`
                    );
                }

                // 2. 最優秀競走馬（+5億円・同率1位は全馬表記＆各所有オーナーに+5億円）
                const allHorses = players.flatMap(p => (p.horses || []).map(h => ({ horse: h, owner: p })));
                const maxHorseWins = Math.max(0, ...allHorses.map(x => x.horse.wins || 0));
                if (maxHorseWins > 0) {
                    const topHorses = allHorses.filter(x => (x.horse.wins || 0) === maxHorseWins);
                    const uniqueOwners = Array.from(new Map(topHorses.map(x => [x.owner.id, x.owner])).values());
                    const label = topHorses
                        .map(x => `${x.horse.name}（${x.owner.name}・${maxHorseWins}勝）`)
                        .join(' / ');
                    awardPlayer('🏅 最優秀競走馬', 50000, uniqueOwners, label);
                }

                // 3〜9. 路線・三冠ボーナス判定
                const checkSeriesBonus = (title, prize, requiredRaces, requireAll = true) => {
                    const matched = allHorses.filter(({ horse }) => {
                        const won = horse.wonRaceNames || [];
                        return requireAll
                            ? requiredRaces.every(r => won.includes(r))
                            : requiredRaces.some(r => won.includes(r));
                    });
                    if (matched.length > 0) {
                        const owners = Array.from(new Map(matched.map(x => [x.owner.id, x.owner])).values());
                        const label = matched
                            .map(x => `${x.horse.name}（${x.owner.name}）`)
                            .join(' / ');
                        awardPlayer(title, prize, owners, label);
                    }
                };

                checkSeriesBonus('⚡ スプリントの覇者', 30000, ['高松宮記念', 'スプリンターズS']);
                checkSeriesBonus('👑 マイルの皇帝', 30000, ['安田記念', 'マイルチャンピオンシップ']);
                checkSeriesBonus('🏆 牡馬クラシック3冠', 50000, ['皐月賞', '日本ダービー', '菊花賞']);
                checkSeriesBonus('🌸 牝馬クラシック3冠', 30000, ['桜花賞', 'オークス', '秋華賞']);
                checkSeriesBonus('👸 牝馬路線完全制覇', 70000, ['阪神ジュベナイルフィリーズ', '桜花賞', 'オークス', '秋華賞', 'ヴィクトリアマイル', 'エリザベス女王杯']);
                checkSeriesBonus('🌱 春古馬3冠', 50000, ['大阪杯', '天皇賞（春）', '宝塚記念']);
                checkSeriesBonus('🍁 秋古馬3冠', 50000, ['天皇賞（秋）', 'ジャパンカップ', '有馬記念']);

                data.finalAwards = awards;
            }

            renderAuction(data) {

                                            <button onclick="window.gameApp.adjustBidAmount(1000, ${maxBid})" class="py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-black text-white border border-slate-600">+1,000万</button>
                                            <button onclick="window.gameApp.adjustBidAmount(3000, ${maxBid})" class="py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-black text-white border border-slate-600">+3,000万</button>
                                            <button onclick="window.gameApp.adjustBidAmount(5000, ${maxBid})" class="py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-black text-white border border-slate-600">+5,000万</button>
                                            <button onclick="window.gameApp.adjustBidAmount(10000, ${maxBid})" class="py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-black text-white border border-slate-600">+1億</button>
                                            <button onclick="window.gameApp.adjustBidAmount(-1000, ${maxBid})" class="py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-black text-rose-300 border border-slate-600">-1,000万</button>
                                            <button onclick="window.gameApp.resetBidAmount()" class="py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-black text-slate-300 border border-slate-600">リセット</button>

                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                                            <button onclick="window.gameApp.submitBid(0)"

                                                💰 ${formatMoney(this.bidAmount)} で入札確定
                                            </button>
                                        </div>
                                    </div>
                                `}

                                <!-- 各プレイヤー入札状況 -->
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2">
                                    ${data.players.map(p => `

                                            <div class="flex items-center justify-between gap-1">
                                                <span class="font-bold text-white truncate">${p.name}</span>
                                                <span class="text-[11px] font-black text-amber-300 shrink-0">${formatMoney(p.money)}</span>

                                ${isHost ? `
                                    <button onclick="window.gameApp.proceedFromAuctionToPaddock()"

                                        ➡️ パドック画面へ進む（出走馬＆装備選択）

                        `}
                    </div>

            }

            renderPaddock(data) {
                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];
                const raceDistCat = getDistanceCategory(race.distance);
                const trackProfile = TRACK_PROFILES[race.track] || TRACK_PROFILES['東京競馬場'];
                const me = data.players.find(p => p.id === this.playerId);
                const isSecret = this.isSecretMode(data);
                const selectedHorse = me ? (me.horses.find(h => h.id === me.selectedHorseId) || me.horses[0]) : null;
                const stageTabs = [
                    { key: 'early', label: '序盤', ratio: Math.round(trackProfile.early * 100) },
                    { key: 'mid', label: '中盤', ratio: Math.round(trackProfile.mid * 100) },
                    { key: 'late', label: '終盤', ratio: Math.round(trackProfile.late * 100) },
                    { key: 'final', label: '最終盤', ratio: Math.round(trackProfile.final * 100) }
                ];
                const currentStageObj = stageTabs.find(s => s.key === this.paddockStageTab) || stageTabs[0];
                const previewBreakdown = (me && selectedHorse) ? this.getRunnerAbilityBreakdown(me, selectedHorse, race, currentStageObj.key, data) : null;

                return `
                    <div class="max-w-5xl mx-auto space-y-5">
                        <!-- レース情報バナー -->
                        <div class="bg-slate-900 border border-emerald-500/60 rounded-2xl p-4 sm:p-5 shadow-xl space-y-2">
                            <div class="flex flex-wrap items-center justify-between gap-2">
                                <div>
                                    <span class="text-xs font-black text-amber-400">第${data.raceIndex + 1}戦 / 全${races.length}戦 ・ ${race.dateLabel}</span>
                                    <h2 class="text-xl sm:text-2xl font-black text-white">${race.name}</h2>
                                </div>
                                <div class="flex flex-wrap gap-2 text-xs font-black">
                                    <span class="px-3 py-1 rounded-full bg-emerald-950 border border-emerald-500/50 text-emerald-200">${race.track}</span>
                                    <span class="px-3 py-1 rounded-full bg-amber-950 border border-amber-500/50 text-amber-200">芝${race.distance}m（${raceDistCat}）</span>
                                    <span class="px-3 py-1 rounded-full bg-slate-800 border border-slate-600 text-slate-200">${race.condition}</span>
                                </div>
                            </div>
                            <div class="text-xs text-slate-300 flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-slate-800">
                                <span>🏟️ コース特性：${trackProfile.desc}</span>
                                <span>💰 1着 ${formatMoney(race.prizes[0])} ／ 2着 ${formatMoney(race.prizes[1])} ／ 3着 ${formatMoney(race.prizes[2])}</span>
                            </div>
                        </div>

                        ${me ? `
                            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
                                <!-- 左：出走馬選択 -->
                                <div class="lg:col-span-7 bg-slate-900 border border-slate-700 rounded-2xl p-4 sm:p-5 space-y-3">
                                    <div class="flex flex-wrap items-center justify-between gap-2">
                                        <h3 class="text-base font-black text-white">🐎 出走させる競走馬を選択</h3>
                                        ${!isSecret ? `
                                            <div class="inline-flex bg-slate-950 border border-slate-700 rounded-xl p-1 gap-1">
                                                ${stageTabs.map(tab => `
                                                    <button onclick="window.gameApp.setPaddockStageTab('${tab.key}')"
                                                        class="px-2.5 py-1 rounded-lg text-xs font-black transition ${currentStageObj.key === tab.key ? 'bg-amber-400 text-slate-950 shadow' : 'text-slate-300 hover:bg-slate-800'}">
                                                        ${tab.label}<span class="text-[10px] opacity-80 ml-0.5">(${tab.ratio}%)</span>
                                                    </button>
                                                `).join('')}
                                            </div>
                                        ` : ''}
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        ${me.horses.map(h => {
                                            const disabled = race.fillyOnly && h.sex !== '牝';
                                            const isSelected = selectedHorse && selectedHorse.id === h.id;
                                            const fatigue = getFatigueInfo(h, race);
                                            const memo = this.getHorseMemo(h.id);
                                            const horseBreakdown = !isSecret ? this.getRunnerAbilityBreakdown(me, h, race, currentStageObj.key, data) : null;
                                            return `
                                                <div onclick="${disabled || me.paddockReady ? '' : `window.gameApp.selectHorse('${h.id}')`}"
                                                    class="p-3.5 rounded-xl border transition ${disabled ? 'opacity-40 cursor-not-allowed bg-slate-950 border-slate-800' : (isSelected ? 'bg-emerald-950/80 border-amber-400 ring-2 ring-amber-400/40 cursor-pointer' : 'bg-slate-800/80 border-slate-700 hover:border-slate-500 cursor-pointer')}">
                                                    <div class="flex items-center justify-between">
                                                        <span class="font-black text-white text-sm">${h.name}</span>
                                                        <span class="text-xs px-2 py-0.5 rounded font-black ${h.sex === '牝' ? 'bg-pink-950 text-pink-300 border border-pink-500/40' : 'bg-sky-950 text-sky-300 border border-sky-500/40'}">${h.sex}馬</span>
                                                    </div>
                                                    ${isSecret ? `
                                                        <div class="text-[11px] text-amber-300 mt-1.5">🕵️ 素質非公開（${h.wins || 0}勝）</div>
                                                        <div class="mt-2 grid grid-cols-3 gap-1" onclick="event.stopPropagation()">
                                                            <select onchange="window.gameApp.updateHorseMemo('${h.id}', 'distance', this.value)" class="bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-[10px] text-slate-200">
                                                                <option value="">距離メモ</option>
                                                                ${DIST_CATEGORIES.map(d => `<option value="${d}" ${memo.distance === d ? 'selected' : ''}>${d}</option>`).join('')}
                                                            </select>
                                                            <select onchange="window.gameApp.updateHorseMemo('${h.id}', 'style', this.value)" class="bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-[10px] text-slate-200">
                                                                <option value="">脚質メモ</option>
                                                                ${STYLES.map(s => `<option value="${s}" ${memo.style === s ? 'selected' : ''}>${s}</option>`).join('')}
                                                            </select>
                                                            <select onchange="window.gameApp.updateHorseMemo('${h.id}', 'unruly', this.value)" class="bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-[10px] text-slate-200">
                                                                <option value="">気性メモ</option>

                                                                <option value="気性難" ${memo.unruly === '気性難' ? 'selected' : ''}>気性難</option>
                                                            </select>

                                                        <!-- 選択中展開の全補正込み出目レンジ -->
                                                        <div class="mt-2 bg-slate-950/90 border ${isSelected ? 'border-amber-400/70' : 'border-slate-700'} rounded-lg px-2.5 py-1.5 flex items-center justify-between">
                                                            <span class="text-[11px] font-bold text-slate-300">🎲 ${currentStageObj.label}出目（補正込）</span>

                                                        </div>
