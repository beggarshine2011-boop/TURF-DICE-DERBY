                                                            ${horseBreakdown.awayStatus ? `<span class="px-1.5 py-0.5 rounded ${horseBreakdown.awayBlocked ? 'bg-emerald-950 text-emerald-300' : 'bg-rose-950 text-rose-300'}">${horseBreakdown.awayStatus}</span>` : ''}
                                                        </div>
                                                    `}
                                                    <div class="text-[11px] mt-1.5 ${fatigue.isFatigued && !horseBreakdown?.fatigueBlocked ? 'text-rose-400 font-bold' : 'text-slate-400'}">
                                                        状態：${fatigue.label}${fatigue.isFatigued && horseBreakdown?.fatigueBlocked ? `（${horseBreakdown.fatigueBlockSource}で無効化済）` : ''}
                                                    </div>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>

                                <!-- 右：装備スロット＆所持アイテム -->
                                <div class="lg:col-span-5 bg-slate-900 border border-slate-700 rounded-2xl p-4 sm:p-5 space-y-4">
                                    <h3 class="text-base font-black text-white">🎒 騎手・装備・調教セット</h3>

                                    <div class="space-y-2">
                                        ${['騎手', '装備', '調教'].map(cat => {
                                            const eq = me.equipped?.[cat];
                                            return `
                                                <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex items-center justify-between gap-2">
                                                    <div>
                                                        <div class="text-[11px] font-black text-amber-400">${cat}スロット</div>
                                                        ${eq ? `
                                                            <div class="text-sm font-black text-white">${eq.name}</div>
                                                            <div class="text-[11px] text-slate-300">${eq.desc}</div>
                                                        ` : `<div class="text-xs text-slate-500">未装備</div>`}
                                                    </div>
                                                    ${eq && !me.paddockReady ? `
                                                        <button onclick="window.gameApp.unequipItem('${cat}')"
                                                            class="px-2.5 py-1 rounded-lg bg-slate-700 hover:bg-rose-800 text-xs font-bold text-white shrink-0">
                                                            外す
                                                        </button>
                                                    ` : ''}
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>

                                    ${!isSecret && previewBreakdown ? `
                                        <div class="bg-emerald-950/60 border border-emerald-600/50 rounded-xl p-3 text-xs space-y-1.5">
                                            <div class="font-black text-emerald-300">📊 選択馬の全展開ダイス見込み（現在装備反映）</div>
                                            <div class="grid grid-cols-4 gap-1.5 text-center">
                                                ${stageTabs.map(st => {
                                                    const bd = this.getRunnerAbilityBreakdown(me, selectedHorse, race, st.key, data);
                                                    const isCurrent = st.key === currentStageObj.key;
                                                    return `
                                                        <div onclick="window.gameApp.setPaddockStageTab('${st.key}')"
                                                            class="cursor-pointer rounded-lg p-1.5 border transition ${isCurrent ? 'bg-amber-400/20 border-amber-400 text-amber-200 font-black' : 'bg-slate-900/80 border-slate-700 text-slate-300 hover:border-slate-500'}">
                                                            <div class="text-[10px]">${st.label}</div>
                                                            <div class="text-xs font-black mt-0.5">${bd.min}〜${bd.max}</div>
                                                        </div>
                                                    `;
                                                }).join('')}
                                            </div>
                                            <div class="text-slate-300">${previewBreakdown.distLabel} ／ ${previewBreakdown.styleLabel}</div>
                                        </div>
                                    ` : ''}

                                    <div>
                                        <div class="text-xs font-bold text-slate-400 mb-2">所持アイテム一覧（クリックで装着）</div>
                                        <div class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                                            ${me.inventory.length === 0 ? `<div class="text-xs text-slate-500">所持アイテムなし</div>` : me.inventory.map((it, idx) => `
                                                <div onclick="${me.paddockReady ? '' : `window.gameApp.equipItem(${idx})`}"
                                                    class="p-2.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700 cursor-pointer transition">
                                                    <div class="flex items-center justify-between">
                                                        <span class="text-xs font-black text-white">【${it.category}】${it.name}</span>
                                                        <span class="text-[10px] text-amber-300 font-bold">装着する</span>
                                                    </div>
                                                    <div class="text-[11px] text-slate-400 mt-0.5">${it.desc}</div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>

                                    ${me.paddockReady ? `
                                        <div class="bg-emerald-950 border border-emerald-500 rounded-xl p-3.5 text-center text-sm font-black text-emerald-300">
                                            ✅ 出走準備完了！他のオーナーを待っています...
                                        </div>
                                    ` : `
                                        <button onclick="window.gameApp.confirmPaddockReady()"
                                            class="w-full bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 font-black py-3.5 rounded-xl text-base shadow-lg transition">
                                            🏇 この馬・装備で出走確定！
                                        </button>
                                    `}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            renderRacing(data) {
                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];
                const rs = data.raceState;
                const isHost = data.hostId === this.playerId;
                const isSecret = this.isSecretMode(data);
                const currentTurn = Math.max(1, rs.turn || 1);
                const stage = this.getStageForTurn(currentTurn, race.track, rs.maxTurns);
                const maxProgress = Math.max(0, ...rs.runners.map(r => r.progress || 0));

                return `
                    <div class="max-w-5xl mx-auto space-y-4">
                        <!-- 上部固定ステータスバー -->
                        <div class="bg-slate-900 border-2 border-amber-400 rounded-2xl p-4 shadow-2xl space-y-2">
                            <div class="flex flex-wrap items-center justify-between gap-2">
                                <div>
                                    <span class="text-xs font-black text-amber-400">${race.name}（${race.track}・芝${race.distance}m）</span>
                                    <h2 class="text-lg sm:text-xl font-black text-white">
                                        ターン ${rs.turn} / ${rs.maxTurns}（残り ${(rs.maxTurns - rs.turn) * 100}m） ・ 展開：【${stage.label}】
                                    </h2>
                                </div>
                                ${!rs.isStarted ? (isHost ? `
                                    <button onclick="window.gameApp.startRace()"
                                        class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 font-black text-sm shadow-lg animate-bounce">
                                        🎺 レース開始！（3秒ごとに自動進行）
                                    </button>
                                ` : `
                                    <span class="px-4 py-2 rounded-xl bg-slate-800 text-amber-300 text-xs font-black animate-pulse">
                                        ホストがゲートを開けるのを待っています...
                                    </span>
                                `) : `
                                    <span class="px-3 py-1.5 rounded-full bg-emerald-950 border border-emerald-500 text-emerald-300 text-xs font-black">
                                        🔥 レース進行中（3秒オート）
                                    </span>
                                `}
                            </div>
                            <div class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs sm:text-sm font-bold text-amber-200">
                                🎙️ ${rs.commentary}
                            </div>
                        </div>

                        <!-- ターフ・レーン表示 -->
                        <div class="turf-pattern border-2 border-emerald-600/70 rounded-2xl p-4 sm:p-5 space-y-4 shadow-2xl">
                            ${rs.runners.map(runner => {
                                const player = data.players.find(p => p.id === runner.playerId);
                                const horse = player?.horses.find(h => h.id === runner.horseId);
                                const breakdown = (player && horse) ? this.getRunnerAbilityBreakdown(player, horse, race, stage.key, data) : null;
                                const pct = Math.min(92, Math.round((runner.progress / Math.max(1, rs.maxTurns)) * 90));
                                const jockey = player?.equipped?.['騎手'];
                                const gear = player?.equipped?.['装備'];
                                const train = player?.equipped?.['調教'];
                                const isLeader = (runner.progress || 0) === maxProgress;
                                const behindSteps = Math.max(0, maxProgress - (runner.progress || 0));
                                const gapBadgeText = isLeader
                                    ? '👑 先頭'
                                    : `${behindSteps}馬身差`;
                                const wonRacesList = (horse?.wonRaceNames && horse.wonRaceNames.length > 0)
                                    ? horse.wonRaceNames.join('・')
                                    : '';

                                return `
                                    <div class="rounded-xl p-3.5 space-y-2.5 transition-all ${isLeader ? 'bg-gradient-to-r from-amber-950/90 via-slate-950/95 to-amber-950/80 border-2 border-amber-400 shadow-lg shadow-amber-500/20 ring-1 ring-amber-300/40' : 'bg-slate-950/85 border border-emerald-700/50'}">
                                        <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
                                            <!-- 左側：馬情報＆進捗 -->
                                            <div class="flex flex-wrap items-center gap-2">
                                                <span class="w-3 h-3 rounded-full" style="background-color:${runner.playerColor}"></span>
                                                <span class="font-black text-sm sm:text-base ${isLeader ? 'text-amber-300' : 'text-white'}">${runner.horseName}</span>
                                                <span class="text-[11px] px-1.5 py-0.5 rounded font-black ${runner.sex === '牝' ? 'bg-pink-950 text-pink-300 border border-pink-500/40' : 'bg-sky-950 text-sky-300 border border-sky-500/40'}">${runner.sex}馬</span>
                                                <span class="text-slate-400">（${runner.playerName} ／ ${player?.stable || ''}）</span>
                                                <span class="font-black ${isLeader ? 'text-amber-300' : 'text-emerald-300'}">進行: ${runner.progress}マス</span>
                                            </div>
                                            <!-- 右側：レンジ（左）＋ 出た出目（中央）＋ 馬身差表記（一番右・基準サイズ統一） -->
                                            <div class="flex flex-wrap items-center gap-2 sm:gap-2.5 ml-auto">
                                                ${!isSecret && breakdown ? `
                                                    <span class="px-3.5 py-1 rounded-xl bg-slate-900/90 border-2 border-emerald-500/70 text-emerald-200 font-black text-sm sm:text-base shadow">
                                                        レンジ: ${breakdown.min}〜${breakdown.max}
                                                    </span>
                                                ` : ''}
                                                <span class="px-3.5 py-1 rounded-xl border-2 font-black text-sm sm:text-base shadow ${runner.lastRoll !== null ? (runner.lastMoved ? 'bg-amber-400 text-slate-950 border-amber-200' : 'bg-slate-900 border-amber-400/80 text-amber-300') : 'bg-slate-900/80 border-slate-600 text-slate-400'}">
                                                    🎲 出目: ${runner.lastRoll !== null ? `${runner.lastRoll}${runner.lastMoved ? ' ⚡' : ''}` : '-'}
                                                </span>
                                                <span class="px-3.5 py-1 rounded-xl font-black text-sm sm:text-base shadow ${isLeader ? 'bg-amber-400 text-slate-950 border-2 border-amber-200' : 'bg-slate-800 border-2 border-slate-500 text-white'}">
                                                    ${gapBadgeText}
                                                </span>
                                            </div>
                                        </div>

                                        <!-- 各馬の距離適性・脚質・装備・各種ボーナス＆デバフ一覧 -->
                                        ${breakdown ? `
                                            <div class="bg-slate-900/95 border border-slate-800 rounded-lg p-2.5 space-y-2 text-[11px]">
                                                <!-- 装備アイテム（騎手・装備・調教） -->
                                                <div class="flex flex-wrap items-center gap-1.5">
                                                    <span class="font-black text-amber-300">🎒 装備:</span>
                                                    <span class="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-200">
                                                        騎手: <strong class="text-white">${jockey ? jockey.name : 'なし'}</strong>
                                                    </span>
                                                    <span class="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-200">
                                                        装備: <strong class="text-white">${gear ? gear.name : 'なし'}</strong>
                                                    </span>
                                                    <span class="px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-200">
                                                        調教: <strong class="text-white">${train ? train.name : 'なし'}</strong>
                                                    </span>
                                                </div>

                                                <!-- 距離適性・脚質・勝利ボーナス・各種デバフ -->
                                                ${!isSecret ? `
                                                    <div class="flex flex-wrap items-center gap-1.5">
                                                        <span class="px-2 py-0.5 rounded ${breakdown.isDistMatch ? 'bg-emerald-950/90 border border-emerald-600/50 text-emerald-200' : 'bg-amber-950/90 border border-amber-600/50 text-amber-200'}">
                                                            📏 ${breakdown.distLabel}
                                                        </span>
                                                        <span class="px-2 py-0.5 rounded ${breakdown.isStyleActive ? 'bg-emerald-950/90 border border-emerald-600/50 text-emerald-200 font-bold' : 'bg-slate-800 text-slate-300'}">
                                                            🏃 ${breakdown.styleLabel}
                                                        </span>
                                                        <span class="px-2 py-0.5 rounded ${breakdown.growthBonus > 0 ? 'bg-amber-950/90 border border-amber-500/50 text-amber-300 font-bold' : 'bg-slate-800 text-slate-400'}">
                                                            🏆 勝利ボーナス: ${breakdown.growthBonus > 0 ? `+${breakdown.growthBonus}（${horse.wins}勝：${wonRacesList}）` : 'なし（0勝・勝ち鞍なし）'}
                                                        </span>
                                                        <span class="px-2 py-0.5 rounded ${horse.isUnruly ? (breakdown.cancelUnruly ? 'bg-emerald-950/90 border border-emerald-600/50 text-emerald-300' : 'bg-rose-950/90 border border-rose-500/50 text-rose-300 font-bold') : 'bg-slate-800 text-slate-400'}">
                                                            💢 気性: ${horse.isUnruly ? breakdown.unrulyStatus : '普通'}
                                                        </span>
                                                        <span class="px-2 py-0.5 rounded ${breakdown.awayStatus ? (breakdown.awayBlocked ? 'bg-emerald-950/90 border border-emerald-600/50 text-emerald-300' : 'bg-rose-950/90 border border-rose-500/50 text-rose-300 font-bold') : 'bg-slate-800 text-slate-400'}">
                                                            🚚 遠征: ${breakdown.awayStatus || '地元開催（デバフなし）'}
                                                        </span>
                                                        <span class="px-2 py-0.5 rounded ${breakdown.fatigue.isFatigued ? (breakdown.fatigueBlocked ? 'bg-emerald-950/90 border border-emerald-600/50 text-emerald-300' : 'bg-rose-950/90 border border-rose-500/50 text-rose-300 font-bold') : 'bg-slate-800 text-slate-400'}">
                                                            💦 疲労: ${breakdown.fatigue.label}${breakdown.fatigue.isFatigued && breakdown.fatigueBlocked ? `（${breakdown.fatigueBlockSource}で無効化）` : ''}
                                                        </span>
                                                        ${breakdown.charmedByCount > 0 ? `
                                                            <span class="px-2 py-0.5 rounded bg-pink-950/90 border border-pink-500/50 text-pink-300 font-bold">
                                                                🎀 魅惑の髪飾り効果（最大-${2 * breakdown.charmedByCount}）
                                                            </span>
                                                        ` : ''}
                                                        ${breakdown.otokogiActive ? `
                                                            <span class="px-2 py-0.5 rounded bg-orange-950/90 border border-orange-500/50 text-orange-300 font-bold">
                                                                🔥 漢義レース鞍発動（最大+5 / 最小-5）
                                                            </span>
                                                        ` : ''}
                                                    </div>
                                                ` : `
                                                    <div class="text-amber-300/90">
                                                        🕵️ 裏モードのため素質（距離適性・脚質・気性難・出目レンジ）は非公開（🏆 ${horse.wins || 0}勝${wonRacesList ? `：${wonRacesList}` : ''} ／ 💦 ${breakdown.fatigue.label}）
                                                    </div>
                                                `}
                                            </div>
                                        ` : ''}

                                        <!-- 走行トラックバー（右向き反転アイコン） -->
                                        <div class="relative h-9 bg-emerald-950/90 border border-emerald-700/60 rounded-lg overflow-hidden flex items-center px-2">
                                            <div class="absolute right-2 top-0 bottom-0 border-r-2 border-dashed border-amber-400/80 flex items-center pr-1 text-[10px] font-black text-amber-300">
                                                GOAL
                                            </div>
                                            <div class="horse-transition absolute text-2xl select-none"
                                                style="left: ${pct}%; transform: scaleX(-1);">
                                                🏇
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            renderRaceResult(data) {
                const res = data.lastRaceResult;
                if (!res) return '';
                const races = this.getActiveRaces(data);
                const isHost = data.hostId === this.playerId;
                const isLastRace = data.raceIndex + 1 >= races.length;

                return `
                    <div class="max-w-4xl mx-auto space-y-5">
                        <div class="bg-slate-900 border-2 border-amber-400 rounded-2xl p-5 sm:p-6 shadow-2xl space-y-4">
                            <div class="text-center border-b border-slate-800 pb-4">
                                <span class="text-xs font-black text-amber-400">OFFICIAL RACE RESULT</span>
                                <h2 class="text-2xl sm:text-3xl font-black text-white mt-1">🏁 ${res.race.name} 確定着順</h2>
                                <p class="text-xs text-slate-400 mt-1">${res.race.dateLabel} ／ ${res.race.track}・芝${res.race.distance}m</p>
                            </div>

                            ${res.photoFinishLogs && res.photoFinishLogs.length > 0 ? `
                                <div class="bg-amber-950/50 border border-amber-500/60 rounded-xl p-3.5 text-xs space-y-1.5">
                                    <div class="font-black text-amber-300">📸 同着写真判定（決着ダイス）が行われました！</div>
                                    ${res.photoFinishLogs.map(log => `
                                        <div class="text-slate-200">
                                            ${log.progress}マス地点（第${log.round}ラウンド）：${log.entries.map(e => `${e.horseName}[${e.roll}]`).join(' vs ')}
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}

                            <div class="space-y-2.5">
                                ${res.standings.map(st => `
                                    <div class="flex flex-wrap items-center justify-between gap-2 p-4 rounded-xl border ${st.rank === 1 ? 'bg-amber-950/50 border-amber-400' : 'bg-slate-800/90 border-slate-700'}">
                                        <div class="flex items-center gap-3">
                                            <span class="text-xl font-black ${st.rank === 1 ? 'text-amber-400' : (st.rank === 2 ? 'text-slate-200' : (st.rank === 3 ? 'text-amber-600' : 'text-slate-500'))}">
                                                ${st.rank}着
                                            </span>
                                            <div>
                                                <div class="font-black text-white text-base sm:text-lg flex items-center gap-2">
                                                    <span>${st.horseName}</span>
                                                    ${st.hadPhotoFinish ? '<span class="text-[10px] bg-amber-500/20 border border-amber-400 text-amber-300 px-1.5 py-0.5 rounded">📸写真判定</span>' : ''}
                                                </div>
                                                <div class="text-xs text-slate-400">${st.playerName} ／ 到達マス：${st.progress}マス</div>
                                            </div>
                                        </div>
                                        <div class="text-right">
                                            <div class="text-base sm:text-lg font-black text-emerald-300">
                                                ${st.prize > 0 ? `+${formatMoney(st.prize)}` : '賞金なし'}
                                            </div>
                                            ${st.kobanApplied ? '<div class="text-[11px] font-black text-amber-300">🪙 おまもりこばん2倍適用！</div>' : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        ${isHost ? `
                            <button onclick="window.gameApp.goToNextRace()"
                                class="w-full bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-slate-950 font-black py-4 rounded-xl text-lg shadow-xl transition">
                                ${isLastRace ? '🏆 全日程終了！TURF DICE DERBY AWARDS へ' : `➡️ 第${data.raceIndex + 2}戦のオークションへ進む`}
                            </button>
                        ` : `
                            <div class="text-center text-sm text-amber-300 font-bold py-3 bg-slate-800 rounded-xl">
                                ホストが次の画面へ進めるのを待っています...
                            </div>
                        `}
                    </div>
                `;
            }

            renderFinalAwards(data) {
                const sortedPlayers = [...data.players].sort((a, b) => b.money - a.money);
                const awards = data.finalAwards || [];

                return `
                    <div class="max-w-4xl mx-auto space-y-6">
                        <!-- TURF DICE DERBY AWARDS 表彰 -->
                        <div class="bg-gradient-to-b from-amber-950/90 to-slate-900 border-2 border-amber-400 rounded-2xl p-6 shadow-2xl space-y-5">
                            <div class="text-center">
                                <div class="text-xs font-black tracking-widest text-amber-400">ANNUAL GRAND PRIX CEREMONY</div>
                                <h2 class="text-2xl sm:text-4xl font-black text-white mt-1">🏆 TURF DICE DERBY AWARDS</h2>
                                <p class="text-xs text-amber-200 mt-1">全G1日程を終え、輝かしい栄誉を称える特別ボーナス賞金が授与されました！</p>
                            </div>

                            ${awards.length === 0 ? `
                                <div class="text-center text-sm text-slate-400 py-4">該当するアワード受賞者はいませんでした。</div>
                            ` : `
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    ${awards.map(aw => `
                                        <div class="bg-slate-900/90 border border-amber-500/50 rounded-xl p-4">
                                            <div class="flex items-center justify-between">
                                                <span class="font-black text-amber-300 text-sm">${aw.title}</span>
                                                <span class="bg-amber-500 text-slate-950 text-xs font-black px-2 py-0.5 rounded">+${formatMoney(aw.prize)}</span>
                                            </div>
                                            <div class="text-sm font-bold text-white mt-1.5">${aw.winners}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>

                        <!-- 最終総資産ランキング -->
                        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
                            <h3 class="text-xl font-black text-white border-b border-slate-700 pb-3">👑 最終オーナー総資産ランキング</h3>
                            <div class="space-y-3">
                                ${sortedPlayers.map((p, idx) => `
                                    <div class="flex items-center justify-between p-4 rounded-xl border ${idx === 0 ? 'bg-amber-950/40 border-amber-400' : 'bg-slate-800 border-slate-700'}">
                                        <div class="flex items-center gap-3">
                                            <span class="text-xl font-black ${idx === 0 ? 'text-amber-400' : 'text-slate-400'}">${idx + 1}位</span>
                                            <div>
                                                <div class="font-black text-white text-lg">${p.name}</div>
                                                <div class="text-xs text-slate-400">${p.stable}所属 ／ G1通算 ${p.wins}勝</div>
                                            </div>
                                        </div>
                                        <div class="text-xl sm:text-2xl font-black text-amber-300">${formatMoney(p.money)}</div>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="pt-4 text-center">
                                <button onclick="window.gameApp.leaveRoom()"
                                    class="bg-emerald-600 hover:bg-emerald-500 text-white font-black px-8 py-3.5 rounded-xl shadow-lg transition">
                                    タイトル画面へ戻る
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        window.onload = function () {
            window.gameApp = new TurfDiceDerby();
            window.gameApp.renderGame();
        };
    </script>
</body>
</html>
