        const HORSE_WORDS_FEMALE = ['クイーン', 'アイ', 'ドンナ', 'アレグリア', 'アイランド', 'ジェネシス', 'ビスタ', 'スカーレット', 'グルーヴ', 'ローズ', 'タクト', 'ホワイト', 'ウオッカ', 'ソダシ', 'アパパネ', 'ブエナ'];

        function formatMoney(manYen) {
            if (manYen === 0) return '0万円';
            const oku = Math.floor(manYen / 10000);
            const man = manYen % 10000;
            if (oku > 0 && man > 0) return `${oku}億${man.toLocaleString()}万円`;
            if (oku > 0) return `${oku}億円`;
            return `${man.toLocaleString()}万円`;
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // ==========================================
        // 2. メインゲームクラス
        // ==========================================
        class TurfDiceDerby {
            constructor() {
                this.roomId = null;
                this.playerId = this.getOrCreatePlayerId();
                this.roomData = null;
                this.unsubscribeRoom = null;
                this.selectedHorseId = null;
                this.bidAmount = 1000;
                this.isProcessing = false;
                this.raceInterval = null;
                this.horseMemos = {};
            }

            isSecretMode(data = this.roomData) {
                const modeKey = data?.mode || 'classic';
                return Boolean(GAME_MODES[modeKey]?.isSecret);
            }

            getHorseMemo(horseId) {
                return this.horseMemos[horseId] || { distance: '', style: '', unruly: '' };
            }

            updateHorseMemo(horseId, field, value) {
                if (!this.horseMemos[horseId]) {
                    this.horseMemos[horseId] = { distance: '', style: '', unruly: '' };
                }
                this.horseMemos[horseId][field] = value;
                this.renderGame();
            }

            getOrCreatePlayerId() {
                let id = sessionStorage.getItem('tdd_player_id');
                if (!id) {
                    id = 'player_' + Math.random().toString(36).substring(2, 10);
                    sessionStorage.setItem('tdd_player_id', id);
                }
                return id;
            }

            generateRoomId() {
                return Math.floor(100000 + Math.random() * 900000).toString();
            }

            showToast(msg, type = 'info') {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const el = document.createElement('div');
                const colors = {
                    info: 'bg-emerald-900 border-emerald-500 text-white',
                    success: 'bg-amber-900 border-amber-400 text-amber-100',
                    error: 'bg-red-900 border-red-500 text-white'
                };
                el.className = `${colors[type] || colors.info} border px-4 py-3 rounded-xl shadow-xl text-sm font-bold transition-all duration-300`;
                el.textContent = msg;
                container.appendChild(el);
                setTimeout(() => {
                    el.style.opacity = '0';
                    setTimeout(() => el.remove(), 300);
                }, 3200);
            }

            getActiveRaces(data = this.roomData) {
                const modeKey = data?.mode || 'classic';
                return (GAME_MODES[modeKey] || GAME_MODES.classic).races;
            }

            // Firestore & LocalStorage 同期保存
            async saveRoomData(roomId, data) {
                this.roomData = data;
                if (firebaseDb) {
                    try {
                        await firebaseDb.collection('rooms').doc(roomId).set(data);
                        return;
                    } catch (err) {
                        console.warn('Firestore書き込みエラー、ローカル保存にフォールバック:', err);
                    }
                }
                localStorage.setItem('tdd_room_' + roomId, JSON.stringify(data));
                this.renderGame();
            }

            subscribeToRoom(roomId) {
                if (this.unsubscribeRoom) {
                    this.unsubscribeRoom();
                    this.unsubscribeRoom = null;
                }
                if (firebaseDb) {
                    this.unsubscribeRoom = firebaseDb.collection('rooms').doc(roomId).onSnapshot((doc) => {
                        if (doc.exists) {
                            const incoming = doc.data();
                            this.roomData = incoming;
                            this.handleHostAutoProgress(incoming);
                            this.renderGame();
                        }
                    }, (err) => {
                        console.error('Firestoreリアルタイム同期エラー:', err);
                    });
                } else {
                    window.addEventListener('storage', (e) => {
                        if (e.key === 'tdd_room_' + roomId && e.newValue) {
                            const incoming = JSON.parse(e.newValue);
                            this.roomData = incoming;
                            this.handleHostAutoProgress(incoming);
                            this.renderGame();
                        }
                    });
                }
            }

            async handleHostAutoProgress(incomingData) {
                if (!incomingData || incomingData.hostId !== this.playerId || this.isProcessing) return;

                if (incomingData.phase === 'auction' && incomingData.auction) {
                    const needsCpu = incomingData.players.some(p => p.isCpu && p.auctionBid === null);
                    const allBid = incomingData.players.every(p => p.auctionBid !== null);
                    if (needsCpu || allBid) {
                        this.isProcessing = true;
                        try {
                            const copy = JSON.parse(JSON.stringify(incomingData));
                            this.processAuctionProgress(copy);
                            await this.saveRoomData(this.roomId, copy);
                        } finally {
                            this.isProcessing = false;
                        }
                    }
                } else if (incomingData.phase === 'paddock') {
                    const needsCpu = incomingData.players.some(p => p.isCpu && !p.paddockReady);
                    const allReady = incomingData.players.every(p => p.paddockReady);
                    if (needsCpu || allReady) {
                        this.isProcessing = true;
                        try {
                            const copy = JSON.parse(JSON.stringify(incomingData));
                            this.processPaddockProgress(copy);
                            await this.saveRoomData(this.roomId, copy);
                        } finally {
                            this.isProcessing = false;
                        }
                    }
                }
            }

            generateStableHorses(ownerId, ownerName, includeFillies = false) {
                const horses = [];
                // 牡馬4頭
                const maleDists = shuffleArray(DIST_CATEGORIES);
                const maleStyles = shuffleArray(STYLES);
                const unrulyMaleIdx = Math.floor(Math.random() * 4);
                const usedNames = new Set();

                // オーナー名を冠名（接頭辞または接尾辞）として付与するヘルパー
                const cleanCrown = (ownerName || 'オーナー').replace(/\(CPU\)$/i, '').trim() || 'オーナー';
                const buildHorseName = (baseWord) => {
                    return Math.random() < 0.5 ? `${cleanCrown}${baseWord}` : `${baseWord}${cleanCrown}`;
                };

                for (let i = 0; i < 4; i++) {
                    let name = '';
                    let attempts = 0;
                    do {
                        const baseWord = HORSE_WORDS_MALE[Math.floor(Math.random() * HORSE_WORDS_MALE.length)];
                        name = buildHorseName(baseWord);
                        attempts++;
                    } while (usedNames.has(name) && attempts < 50);
                    usedNames.add(name);

                    horses.push({
                        id: `${ownerId}_m_${i}`,
                        ownerId,
                        name,
                        sex: '牡',
                        distance: maleDists[i],
                        style: maleStyles[i],
                        isUnruly: i === unrulyMaleIdx,
                        baseMin: 10,
                        baseMax: 20,
                        wins: 0,
                        wonRaceNames: []
                    });
                }

                // 牝馬4頭（真の最強馬決定戦モードのみ）
                if (includeFillies) {
                    const femaleDists = shuffleArray(DIST_CATEGORIES);
                    const femaleStyles = shuffleArray(STYLES);
                    const unrulyFemaleIdx = Math.floor(Math.random() * 4);

                    for (let i = 0; i < 4; i++) {
                        let name = '';
                        let attempts = 0;
                        do {
                            const baseWord = HORSE_WORDS_FEMALE[Math.floor(Math.random() * HORSE_WORDS_FEMALE.length)];
                            name = buildHorseName(baseWord);
                            attempts++;
                        } while (usedNames.has(name) && attempts < 50);
                        usedNames.add(name);

                        horses.push({
                            id: `${ownerId}_f_${i}`,
                            ownerId,
                            name,
                            sex: '牝',
                            distance: femaleDists[i],
                            style: femaleStyles[i],
                            isUnruly: i === unrulyFemaleIdx,
                            baseMin: 13,
                            baseMax: 18,
                            wins: 0,
                            wonRaceNames: []
                        });
                    }
                }
                return horses;
            }

            // ==========================================
            // 3. ルーム作成・参加・開始
            // ==========================================
            async createRoom() {
                const nameInput = document.getElementById('owner-name-input');
                const stableSelect = document.getElementById('owner-stable-select');
                const modeSelect = document.querySelector('input[name="game-mode"]:checked');

                const ownerName = (nameInput?.value || '').trim() || 'オーナー1';
                const stable = stableSelect?.value || '美浦';
                const mode = modeSelect?.value || 'classic';
                const includeFillies = GAME_MODES[mode].includeFillies;

                const newRoomId = this.generateRoomId();
                this.roomId = newRoomId;

                const hostPlayer = {
                    id: this.playerId,
                    name: ownerName,
                    stable,
                    isCpu: false,
                    color: PLAYER_COLORS[0],
                    money: 10000, // 初期資金1億円
                    wins: 0,
                    wonRaceNames: [],
                    horses: this.generateStableHorses(this.playerId, ownerName, includeFillies),
                    inventory: JSON.parse(JSON.stringify(INITIAL_JOCKEY_ITEMS)),
                    equipped: { '騎手': null, '装備': null, '調教': null },
                    selectedHorseId: null,
                    paddockReady: false,
                    auctionBid: null
                };

                const initialData = {
                    roomId: newRoomId,
                    hostId: this.playerId,
                    mode,
                    phase: 'lobby', // lobby | auction | paddock | racing | race_result | final_awards
                    raceIndex: 0,
                    players: [hostPlayer],
                    auction: null,
                    raceState: null,
                    lastRaceResult: null,
                    updatedAt: Date.now()
                };

                this.subscribeToRoom(newRoomId);
                await this.saveRoomData(newRoomId, initialData);
                this.showToast(`部屋を作成しました（ID: ${newRoomId}）`, 'success');
            }

            async joinRoom() {
                const nameInput = document.getElementById('owner-name-input');
                const stableSelect = document.getElementById('owner-stable-select');
                const roomInput = document.getElementById('join-room-input');

                const ownerName = (nameInput?.value || '').trim() || 'ゲストオーナー';
                const stable = stableSelect?.value || '栗東';
                const targetRoomId = (roomInput?.value || '').trim();

                if (!targetRoomId || targetRoomId.length !== 6) {
                    this.showToast('6桁の部屋IDを入力してください', 'error');
                    return;
                }

                let data = null;
                if (firebaseDb) {
                    try {
                        const doc = await firebaseDb.collection('rooms').doc(targetRoomId).get();
                        if (doc.exists) data = doc.data();
                    } catch (err) {
                        console.warn('Firestore読み込みエラー:', err);
                    }
                }
                if (!data) {
                    const localRaw = localStorage.getItem('tdd_room_' + targetRoomId);
                    if (localRaw) data = JSON.parse(localRaw);
                }

                if (!data) {
                    this.showToast('指定された部屋IDが見つかりません', 'error');
                    return;
                }

                this.roomId = targetRoomId;
                this.subscribeToRoom(targetRoomId);

                const existing = data.players.find(p => p.id === this.playerId);
                if (!existing) {
                    if (data.phase !== 'lobby') {
                        this.showToast('すでに対戦が開始されています', 'error');
                        return;
                    }
                    if (data.players.length >= 4) {
                        this.showToast('満員（最大4名）のため参加できません', 'error');
                        return;
                    }

                    const includeFillies = GAME_MODES[data.mode].includeFillies;
                    const newPlayer = {
                        id: this.playerId,
                        name: ownerName,
                        stable,
                        isCpu: false,
                        color: PLAYER_COLORS[data.players.length],
                        money: 10000,
                        wins: 0,
                        wonRaceNames: [],
                        horses: this.generateStableHorses(this.playerId, ownerName, includeFillies),
                        inventory: JSON.parse(JSON.stringify(INITIAL_JOCKEY_ITEMS)),
                        equipped: { '騎手': null, '装備': null, '調教': null },
                        selectedHorseId: null,
                        paddockReady: false,
                        auctionBid: null
                    };
                    data.players.push(newPlayer);
                    data.updatedAt = Date.now();
                    await this.saveRoomData(targetRoomId, data);
                }

                this.showToast(`部屋（ID: ${targetRoomId}）に入室しました！`, 'success');
                this.renderGame();
            }

            async startGame() {
                if (!this.roomData || this.roomData.hostId !== this.playerId) return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const includeFillies = GAME_MODES[data.mode].includeFillies;

                // 4名に満たない枠はCPUを追加
                const cpuNames = ['社台オーナー(CPU)', 'ノーザン社長(CPU)', '個人大馬主(CPU)'];
                const cpuStables = ['栗東', '美浦', '栗東'];
                let cpuIdx = 0;

                while (data.players.length < 4) {
                    const cpuId = 'cpu_' + (data.players.length + 1);
                    const cName = cpuNames[cpuIdx] || `CPUオーナー${data.players.length + 1}`;
                    const cStable = cpuStables[cpuIdx % cpuStables.length];
                    cpuIdx++;

                    data.players.push({
                        id: cpuId,
                        name: cName,
                        stable: cStable,
                        isCpu: true,
                        color: PLAYER_COLORS[data.players.length],
                        money: 10000,
                        wins: 0,
                        wonRaceNames: [],
                        horses: this.generateStableHorses(cpuId, cName, includeFillies),
                        inventory: JSON.parse(JSON.stringify(INITIAL_JOCKEY_ITEMS)),
                        equipped: { '騎手': null, '装備': null, '調教': null },
                        selectedHorseId: null,
                        paddockReady: false,
                        auctionBid: null
                    });
                }

                data.raceIndex = 0;
                this.setupAuctionPhase(data);
                await this.saveRoomData(this.roomId, data);
            }

            // ==========================================
            // 4. オークションフェーズ
            // ==========================================
            setupAuctionPhase(data) {
                const pool = shuffleArray(ITEM_CATALOG).slice(0, 2);
                data.phase = 'auction';
                data.auction = {
                    itemIndex: 0,
                    items: pool,
                    history: []
                };
                data.players.forEach(p => {
                    p.auctionBid = null;
                });
                this.bidAmount = 1000;
            }

            async submitBid(amount) {
                if (!this.roomData || this.roomData.phase !== 'auction' || this.isProcessing) return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const me = data.players.find(p => p.id === this.playerId);
                if (!me || me.auctionBid !== null) return;

                const validBid = Math.max(0, Math.min(me.money, Math.floor(amount / 1000) * 1000));
                me.auctionBid = validBid;

                // ホストがCPU入札と全員完了判定を処理
                if (data.hostId === this.playerId) {
                    this.processAuctionProgress(data);
                }
                await this.saveRoomData(this.roomId, data);
            }

            processAuctionProgress(data) {
                // CPUの入札を自動決定
                data.players.forEach(p => {
                    if (p.isCpu && p.auctionBid === null) {
                        if (p.money < 1000 || Math.random() < 0.35) {
                            p.auctionBid = 0;
                        } else {
                            const maxStep = Math.min(Math.floor(p.money / 1000), 4);
                            const step = Math.floor(Math.random() * maxStep) + 1;
                            p.auctionBid = step * 1000;
                        }
                    }
                });

                const allBid = data.players.every(p => p.auctionBid !== null);
                if (!allBid) return;

                const currentItem = data.auction.items[data.auction.itemIndex];
                let highest = 0;
                data.players.forEach(p => {
                    if (p.auctionBid > highest) highest = p.auctionBid;
                });

                let winnerText = '入札なし（流札）';
                if (highest > 0) {
                    const topBidders = data.players.filter(p => p.auctionBid === highest);
                    const winner = topBidders[Math.floor(Math.random() * topBidders.length)];
                    winner.money -= highest;
                    winner.inventory.push(currentItem);
                    winnerText = `${winner.name} が ${formatMoney(highest)} で落札！`;
                }

                data.auction.history.push({
                    item: currentItem,
                    result: winnerText
                });

                if (data.auction.itemIndex < 1) {
                    data.auction.itemIndex += 1;
                    data.players.forEach(p => { p.auctionBid = null; });
                } else {
                    // 全2品終了 -> パドックへ
                    this.setupPaddockPhase(data);
                }
            }

            // ==========================================
            // 5. パドック（出走馬＆アイテム装備）フェーズ
            // ==========================================
            setupPaddockPhase(data) {
                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];
                data.phase = 'paddock';

                data.players.forEach(p => {
                    p.paddockReady = false;
                    // 牝馬限定戦の場合は牝馬をデフォルト選択
                    const eligibleHorses = race.fillyOnly
                        ? p.horses.filter(h => h.sex === '牝')
                        : p.horses;
                    p.selectedHorseId = eligibleHorses[0]?.id || p.horses[0].id;
                });
            }

            async selectHorse(horseId) {
                if (!this.roomData || this.roomData.phase !== 'paddock') return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const me = data.players.find(p => p.id === this.playerId);
                if (!me || me.paddockReady) return;

                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];
                const horse = me.horses.find(h => h.id === horseId);
                if (!horse) return;
                if (race.fillyOnly && horse.sex !== '牝') {
                    this.showToast('このレースは牝馬限定戦です！', 'error');
                    return;
                }

                me.selectedHorseId = horseId;
                await this.saveRoomData(this.roomId, data);
            }

            async equipItem(invIndex) {
                if (!this.roomData || this.roomData.phase !== 'paddock') return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const me = data.players.find(p => p.id === this.playerId);
                if (!me || me.paddockReady) return;

                const item = me.inventory[invIndex];
                if (!item) return;

                // すでに同カテゴリに装備があればインベントリへ戻す
                const prevEquipped = me.equipped[item.category];
                me.inventory.splice(invIndex, 1);
                if (prevEquipped) {
                    me.inventory.push(prevEquipped);
                }
                me.equipped[item.category] = item;
                await this.saveRoomData(this.roomId, data);
            }

            async unequipItem(category) {
                if (!this.roomData || this.roomData.phase !== 'paddock') return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const me = data.players.find(p => p.id === this.playerId);
                if (!me || me.paddockReady) return;

                const item = me.equipped[category];
                if (!item) return;
                me.equipped[category] = null;
                me.inventory.push(item);
                await this.saveRoomData(this.roomId, data);
            }

            async confirmPaddockReady() {
                if (!this.roomData || this.roomData.phase !== 'paddock') return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const me = data.players.find(p => p.id === this.playerId);
                if (!me || me.paddockReady) return;

                me.paddockReady = true;

                if (data.hostId === this.playerId) {
                    this.processPaddockProgress(data);
                }
                await this.saveRoomData(this.roomId, data);
            }

            processPaddockProgress(data) {
                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];
                const raceDistCat = getDistanceCategory(race.distance);

                // CPUの出走馬と装備を自動決定
                data.players.forEach(p => {
                    if (p.isCpu && !p.paddockReady) {
                        const eligible = race.fillyOnly ? p.horses.filter(h => h.sex === '牝') : p.horses;
                        // 距離適性が合う馬を優先
                        const bestHorse = eligible.find(h => h.distance === raceDistCat) || eligible[Math.floor(Math.random() * eligible.length)];
                        p.selectedHorseId = bestHorse.id;

                        // 所持アイテムを各カテゴリに1つずつ自動装備
                        ['騎手', '装備', '調教'].forEach(cat => {
                            if (!p.equipped[cat]) {
                                const idx = p.inventory.findIndex(it => it.category === cat);
                                if (idx !== -1) {
                                    p.equipped[cat] = p.inventory[idx];
                                    p.inventory.splice(idx, 1);
                                }
                            }
                        });
                        p.paddockReady = true;
                    }
                });

                const allReady = data.players.every(p => p.paddockReady);
                if (allReady) {
                    this.setupRacePhase(data);
                }
            }

            // ==========================================
            // 6. 出目計算＆レース進行ロジック
            // ==========================================
            getRunnerAbilityBreakdown(player, horse, race, stageKey) {
                const eqJockey = player.equipped['騎手'];
                const eqGear = player.equipped['装備'];
                const eqTrain = player.equipped['調教'];

                // 1. 気性難
                const cancelUnruly = (eqJockey?.id === 'j_yokoyama_n') || (eqGear?.id === 'e_menko');
                let unrulyStatus = null;
                if (horse.isUnruly) {
                    unrulyStatus = cancelUnruly ? '気性難(最大+3/最小消去)' : '気性難(最大+3/最小-5)';
                }

                // 2. 遠征判定
                const homeTracks = STABLES[player.stable]?.homeTracks || [];
                const isAway = !homeTracks.includes(race.track);
                const awayBlocked = isAway && eqTrain?.id === 't_local';
                let awayStatus = null;
                if (isAway) {
                    awayStatus = awayBlocked ? '遠征(現地追いで無効)' : '遠征(最大-2)';
                }

                // 3. 距離適性（シフト反映）
                let distShift = 0;
                if (eqJockey?.id === 'j_ikezoe') distShift += 1;
                if (eqTrain?.id === 't_hanro') distShift += 1;
                if (eqTrain?.id === 't_shorten') distShift -= 1;

                const effectiveDist = shiftDistanceCategory(horse.distance, distShift);
                const raceDistCat = getDistanceCategory(race.distance);
                const isDistMatch = effectiveDist === raceDistCat;
                const distLabel = distShift !== 0
                    ? `適性:${horse.distance}→${effectiveDist}(${isDistMatch ? '一致+2' : '不一致-1'})`
                    : `適性:${horse.distance}(${isDistMatch ? '一致+2' : '不一致-1'})`;

                // 4. 脚質＆展開一致
                const styleStageMap = {
                    '逃げ': 'early',
                    '先行': 'mid',
                    '差し': 'late',
                    '追込み': 'final'
                };
                const isStyleActive = styleStageMap[horse.style] === stageKey;
                const styleLabel = isStyleActive
                    ? `脚質:${horse.style}(展開一致+2発動中!)`
                    : `脚質:${horse.style}`;

                // 5. 勝利成長ボーナス（1勝につき最大+1・重複あり／上限なし）
                const growthBonus = horse.wins || 0;

                // 6. 装備中アイテム一覧
                const equippedList = [eqJockey, eqGear, eqTrain].filter(Boolean);

                return {
                    distLabel,
                    isDistMatch,
                    styleLabel,
                    isStyleActive,
                    unrulyStatus,
                    cancelUnruly,
                    awayStatus,
                    awayBlocked,
                    growthBonus,
                    equippedList
                };
            }

            calculateDiceRange(player, horse, race, stageKey) {
                // stageKey: 'early' | 'mid' | 'late' | 'final'
                let minVal = horse.baseMin; // 牡馬10 / 牝馬13
                let maxVal = horse.baseMax; // 牡馬20 / 牝馬18

                const eqJockey = player.equipped['騎手'];
                const eqGear = player.equipped['装備'];
                const eqTrain = player.equipped['調教'];

                // 1. 気性難効果（最大+3, 最小-5）＆打ち消し判定
                if (horse.isUnruly) {
                    maxVal += 3;
                    const cancelUnruly = (eqJockey?.id === 'j_yokoyama_n') || (eqGear?.id === 'e_menko');
                    if (!cancelUnruly) {
                        minVal -= 5;
                    }
                }

                // 2. 輸送競馬ペナルティ（所属厩舎のホーム以外で最大-2 / 「現地追い」で無効化）
                const homeTracks = STABLES[player.stable]?.homeTracks || [];
                const isAway = !homeTracks.includes(race.track);
                if (isAway && eqTrain?.id !== 't_local') {
                    maxVal -= 2;
                }

                // 3. 距離適性（アイテムによる±1シフト反映）
                let distShift = 0;
                if (eqJockey?.id === 'j_ikezoe') distShift += 1;
                if (eqTrain?.id === 't_hanro') distShift += 1;
                if (eqTrain?.id === 't_shorten') distShift -= 1;

                const effectiveHorseDist = shiftDistanceCategory(horse.distance, distShift);
                const raceDistCat = getDistanceCategory(race.distance);

                if (effectiveHorseDist === raceDistCat) {
                    minVal += 2;
                    maxVal += 2;
                } else {
                    minVal -= 1;
                    maxVal -= 1;
                }

                // 4. 脚質ボーナス（該当ステージで最大・最小+2）
                const styleStageMap = {
                    '逃げ': 'early',
                    '先行': 'mid',
                    '差し': 'late',
                    '追込み': 'final'
                };
                if (styleStageMap[horse.style] === stageKey) {
                    minVal += 2;
                    maxVal += 2;
                }

                // 5. 勝利成長ボーナス（1勝につき最大+1・重複あり／上限なし）
                const growthBonus = horse.wins || 0;
                maxVal += growthBonus;

                // 6. 個別アイテム効果
                if (eqJockey) {
                    if (eqJockey.id === 'init_j_nige' && horse.style === '逃げ') { minVal += 1; maxVal += 1; }
                    if (eqJockey.id === 'init_j_senko' && horse.style === '先行') { minVal += 1; maxVal += 1; }
                    if (eqJockey.id === 'init_j_sashi' && horse.style === '差し') { minVal += 1; maxVal += 1; }
                    if (eqJockey.id === 'init_j_oikomi' && horse.style === '追込み') { minVal += 1; maxVal += 1; }
                    if (eqJockey.id === 'j_fukunaga' && horse.sex === '牝') { minVal += 3; maxVal += 3; }
                    if (eqJockey.id === 'j_sakai' && horse.style === '逃げ') { minVal += 3; maxVal += 3; }
                    if (eqJockey.id === 'j_kawada' && horse.style === '先行') { minVal += 3; maxVal += 3; }
                    if (eqJockey.id === 'j_lemaire' && horse.style === '差し') { minVal += 3; maxVal += 3; }
                    if (eqJockey.id === 'j_take' && horse.style === '追込み') { minVal += 3; maxVal += 3; }
                    if (eqJockey.id === 'j_shibata') { minVal += 4; }
                    if (eqJockey.id === 'j_yokoyama_t' && raceDistCat === '短距離') { minVal += 3; maxVal += 3; }
                    if (eqJockey.id === 'j_tosaki' && raceDistCat === 'マイル') { minVal += 3; maxVal += 3; }
                    if (eqJockey.id === 'j_demuro' && raceDistCat === '中距離') { minVal += 3; maxVal += 3; }
                    if (eqJockey.id === 'j_ebina' && raceDistCat === '長距離') { minVal += 3; maxVal += 3; }
                }

                if (eqGear) {
                    if (eqGear.id === 'e_horseshoe') { minVal += 3; }
                    if (eqGear.id === 'e_whip') { maxVal += 3; minVal -= 2; }
                    if (eqGear.id === 'e_brush') { maxVal += 1; minVal += 2; }
                    if (eqGear.id === 'e_feed') { maxVal += 2; }
                }

                if (eqTrain) {
                    if (eqTrain.id === 't_gate' && stageKey === 'early') { maxVal += 3; }
                    if (eqTrain.id === 't_course' && stageKey === 'final') { maxVal += 3; }
                }

                minVal = Math.max(1, minVal);
                maxVal = Math.max(minVal, maxVal);
                return { min: minVal, max: maxVal };
            }

            getStageForTurn(turn, trackName, maxTurns = 10) {
                // 総ターン数（レース距離÷100）を展開割合に応じて割り当て
                const prof = TRACK_PROFILES[trackName] || TRACK_PROFILES['東京競馬場'];
                const tEarly = Math.max(1, Math.round(maxTurns * prof.early));
                const tMid = Math.max(tEarly + 1, tEarly + Math.round(maxTurns * prof.mid));
                const tLate = Math.max(tMid + 1, tMid + Math.round(maxTurns * prof.late));

                if (turn <= tEarly) return { key: 'early', label: '序盤' };
                if (turn <= tMid) return { key: 'mid', label: '中盤' };
                if (turn <= tLate) return { key: 'late', label: '終盤' };
                return { key: 'final', label: '最終盤' };
            }

            setupRacePhase(data) {
                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];
                const totalTurns = Math.max(1, Math.round(race.distance / 100));
                data.phase = 'racing';

                const runners = data.players.map(p => {
                    const horse = p.horses.find(h => h.id === p.selectedHorseId) || p.horses[0];
                    const hasKoban = p.equipped['装備']?.id === 'e_koban';
                    return {
                        playerId: p.id,
                        playerName: p.name,
                        playerColor: p.color,
                        horseId: horse.id,
                        horseName: horse.name,
                        sex: horse.sex,
                        style: horse.style,
                        distance: horse.distance,
                        isUnruly: horse.isUnruly,
                        hasKoban,
                        progress: 0,
                        lastRoll: null,
                        turnLogs: []
                    };
                });

                data.raceState = {
                    turn: 0,
                    maxTurns: totalTurns,
                    runners,
                    commentary: `${race.name}（${race.track}・芝${race.distance}m／全${totalTurns}ターン）ゲートイン完了！`
                };
            }

            async advanceRaceTurn() {
                if (!this.roomData || this.roomData.phase !== 'racing' || this.roomData.hostId !== this.playerId) return;
                if (this.isProcessing) return;
                this.isProcessing = true;

                try {
                    const data = JSON.parse(JSON.stringify(this.roomData));
                    const races = this.getActiveRaces(data);
                    const race = races[data.raceIndex];
                    const rs = data.raceState;

                    if (rs.turn >= rs.maxTurns) {
                        this.finalizeRace(data);
                        await this.saveRoomData(this.roomId, data);
                        return;
                    }

                    rs.turn += 1;
                    const stage = this.getStageForTurn(rs.turn, race.track, rs.maxTurns);

                    // 1. 全員がサイコロを振る
                    const turnResults = rs.runners.map(runner => {
                        const player = data.players.find(p => p.id === runner.playerId);
                        const horse = player.horses.find(h => h.id === runner.horseId);
                        const range = this.calculateDiceRange(player, horse, race, stage.key);
                        const roll = Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;
                        return { runner, roll, range };
                    });

                    // 2. このターンの最大出目を特定し、該当する競走馬全員を1マス進める
                    const maxTurnRoll = Math.max(...turnResults.map(r => r.roll));
                    const turnWinners = [];

                    turnResults.forEach(({ runner, roll, range }) => {
                        const moved = roll === maxTurnRoll ? 1 : 0;
                        runner.lastRoll = roll;
                        runner.lastMoved = moved;
                        runner.progress += moved;
                        runner.turnLogs.push({ turn: rs.turn, stage: stage.label, roll, moved, min: range.min, max: range.max });
                        if (moved > 0) {
                            turnWinners.push(runner.horseName);
                        }
                    });

                    const leaderProg = Math.max(...rs.runners.map(r => r.progress));
                    const topRunners = rs.runners.filter(r => r.progress === leaderProg).map(r => r.horseName);
                    const currentMeters = rs.turn * 100;
                    rs.commentary = `【${currentMeters}m / ${race.distance}m・${stage.label}】最大出目(${maxTurnRoll})の ${turnWinners.join('・')} が1マス前進！現在先頭: ${topRunners.join('・')}（${leaderProg}マス）`;

                    if (rs.turn >= rs.maxTurns) {
                        this.finalizeRace(data);
                    }

                    await this.saveRoomData(this.roomId, data);
                } finally {
                    this.isProcessing = false;
                }
            }

            finalizeRace(data) {
                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];
                const rs = data.raceState;

                // 累計マス数でグループ化し、同着がある場合は最終盤の出目レンジで決着ダイスを振る（写真判定）
                const photoFinishLogs = [];
                const sorted = [...rs.runners].sort((a, b) => b.progress - a.progress);

                // 同着グループの検出とダイス再抽選
                const tieBreakScores = {};
                rs.runners.forEach(r => { tieBreakScores[r.playerId] = 0; });

                const progressGroups = {};
                sorted.forEach(r => {
                    if (!progressGroups[r.progress]) progressGroups[r.progress] = [];
                    progressGroups[r.progress].push(r);
                });

                Object.entries(progressGroups).forEach(([prog, group]) => {
                    if (group.length > 1) {
                        let unresolved = [...group];
                        let round = 1;
                        while (unresolved.length > 1) {
                            const rolls = unresolved.map(runner => {
                                const player = data.players.find(p => p.id === runner.playerId);
                                const horse = player.horses.find(h => h.id === runner.horseId);
                                const finalRange = this.calculateDiceRange(player, horse, race, 'final');
                                const roll = Math.floor(Math.random() * (finalRange.max - finalRange.min + 1)) + finalRange.min;
                                return { runner, roll, range: finalRange };
                            });

                            photoFinishLogs.push({
                                progress: Number(prog),
                                round,
                                entries: rolls.map(x => ({
                                    horseName: x.runner.horseName,
                                    playerName: x.runner.playerName,
                                    playerColor: x.runner.playerColor,
                                    roll: x.roll,
                                    min: x.range.min,
                                    max: x.range.max
                                }))
                            });

                            // 各馬にスコアを加算（上位ほど大きな重みを付けて順位を確定）
                            const distinctRolls = [...new Set(rolls.map(r => r.roll))].sort((a, b) => b - a);
                            rolls.forEach(item => {
                                const rankInRound = distinctRolls.indexOf(item.roll);
                                tieBreakScores[item.runner.playerId] += (distinctRolls.length - rankInRound) * Math.pow(10, 5 - round);
                            });

                            // まだ同点ダイスが残っている馬だけを抽出して続行
                            const rollCounts = {};
                            rolls.forEach(r => { rollCounts[r.roll] = (rollCounts[r.roll] || 0) + 1; });
                            unresolved = rolls.filter(r => rollCounts[r.roll] > 1).map(r => r.runner);
                            round += 1;
                            if (round > 10) break; // 安全弁
                        }
                    }
                });

                const finalSorted = [...rs.runners].sort((a, b) => {
                    if (b.progress !== a.progress) return b.progress - a.progress;
                    const diff = (tieBreakScores[b.playerId] || 0) - (tieBreakScores[a.playerId] || 0);
                    if (diff !== 0) return diff;
                    return Math.random() - 0.5;
                });

                const standings = finalSorted.map((runner, idx) => {
                    const rank = idx + 1;
                    let basePrize = rank <= 3 ? race.prizes[idx] : 0;
                    const finalPrize = runner.hasKoban ? basePrize * 2 : basePrize;

                    const player = data.players.find(p => p.id === runner.playerId);
                    const horse = player.horses.find(h => h.id === runner.horseId);

                    if (finalPrize > 0) {
                        player.money += finalPrize;
                    }
                    if (rank === 1) {
                        player.wins += 1;
                        player.wonRaceNames.push(race.name);
                        horse.wins += 1;
                        horse.wonRaceNames.push(race.name);
                    }

                    const hadPhotoFinish = photoFinishLogs.some(log => log.entries.some(e => e.horseName === runner.horseName));

                    return {
                        rank,
                        playerId: runner.playerId,
                        playerName: runner.playerName,
                        playerColor: runner.playerColor,
                        horseName: runner.horseName,
                        sex: runner.sex,
                        progress: runner.progress,
                        prize: finalPrize,
                        kobanApplied: runner.hasKoban && basePrize > 0,
                        hadPhotoFinish
                    };
                });

                // レース後、装備していたアイテムを消費（リセット）
                data.players.forEach(p => {
                    p.equipped = { '騎手': null, '装備': null, '調教': null };
                });

                data.lastRaceResult = {
                    race,
                    standings,
                    photoFinishLogs
                };
                data.phase = 'race_result';
            }

            async goToNextRace() {
                if (!this.roomData || this.roomData.hostId !== this.playerId) return;
                const data = JSON.parse(JSON.stringify(this.roomData));
                const races = this.getActiveRaces(data);

                if (data.raceIndex + 1 < races.length) {
                    data.raceIndex += 1;
                    this.setupAuctionPhase(data);
                } else {
                    // 全レース終了 -> TURF DICE DERBY AWARDS 集計
                    this.calculateFinalAwards(data);
                }
                await this.saveRoomData(this.roomId, data);
            }

            // ==========================================
            // 7. TURF DICE DERBY AWARDS 集計
            // ==========================================
            calculateFinalAwards(data) {
                const awards = [];
                const players = data.players;

                // 1. 最多勝利オーナー（+5億円）
                const maxOwnerWins = Math.max(...players.map(p => p.wins));
                if (maxOwnerWins > 0) {
                    const topOwners = players.filter(p => p.wins === maxOwnerWins);
                    topOwners.forEach(owner => {
                        owner.money += 50000;
                    });
                    awards.push({
                        title: '🏆 最多勝利オーナー',
                        prize: 50000,
                        winners: topOwners.map(o => `${o.name}（${maxOwnerWins}勝）`).join(' / ')
                    });
                }

                // 2. 最優秀競走馬（+5億円）
                const allHorses = [];
                players.forEach(p => {
                    p.horses.forEach(h => {
                        allHorses.push({ owner: p, horse: h });
                    });
                });
                const maxHorseWins = Math.max(...allHorses.map(item => item.horse.wins));
                if (maxHorseWins > 0) {
                    const topHorses = allHorses.filter(item => item.horse.wins === maxHorseWins);
                    topHorses.forEach(item => {
                        item.owner.money += 50000;
                    });
                    awards.push({
                        title: '🐴 最優秀競走馬',
                        prize: 50000,
                        winners: topHorses.map(item => `${item.horse.name}（所有: ${item.owner.name} / ${maxHorseWins}勝）`).join(' / ')
                    });
                }

                // オーナー単位での制覇判定ヘルパー
                const checkOwnerSweep = (title, requiredRaces, prize) => {
                    const matched = players.filter(p => requiredRaces.every(rName => p.wonRaceNames.includes(rName)));
                    if (matched.length > 0) {
                        matched.forEach(o => { o.money += prize; });
                        awards.push({
                            title,
                            prize,
                            winners: matched.map(o => o.name).join(' / ')
                        });
                    }
                };

                // 同一競走馬での制覇判定ヘルパー
                const checkHorseSweep = (title, requiredRaces, prize) => {
                    const matched = allHorses.filter(item => requiredRaces.every(rName => item.horse.wonRaceNames.includes(rName)));
                    if (matched.length > 0) {
                        matched.forEach(item => { item.owner.money += prize; });
                        awards.push({
                            title,
                            prize,
                            winners: matched.map(item => `${item.horse.name}（所有: ${item.owner.name}）`).join(' / ')
                        });
                    }
                };

                // 3. スプリントの覇者（高松宮記念・スプリンターズS同一オーナー制覇：+3億円）
                checkOwnerSweep('⚡ スプリントの覇者', ['高松宮記念', 'スプリンターズS'], 30000);

                // 4. マイルの皇帝（安田記念・マイルCS同一オーナー制覇：+3億円）
                checkOwnerSweep('👑 マイルの皇帝', ['安田記念', 'マイルチャンピオンシップ'], 30000);

                // 5. 牡馬クラシック3冠（皐月賞・日本ダービー・菊花賞同一競走馬制覇：+5億円）
                checkHorseSweep('🔱 牡馬クラシック3冠', ['皐月賞', '日本ダービー', '菊花賞'], 50000);

                // 6. 牝馬クラシック3冠（桜花賞・オークス・秋華賞同一競走馬制覇：+3億円）
                checkHorseSweep('🌹 牝馬クラシック3冠', ['桜花賞', 'オークス', '秋華賞'], 30000);

                // 7. 牝馬路線完全制覇（阪神JF・桜花賞・オークス・秋華賞・ヴィクトリアM・エリザベス女王杯同一競走馬制覇：+5億円）
                checkHorseSweep('👸 牝馬路線完全制覇', ['阪神ジュベナイルフィリーズ', '桜花賞', 'オークス', '秋華賞', 'ヴィクトリアマイル', 'エリザベス女王杯'], 50000);

                // 8. 春古馬3冠（大阪杯・天皇賞（春）・宝塚記念同一競走馬制覇：+5億円）
                checkHorseSweep('🌸 春古馬3冠', ['大阪杯', '天皇賞（春）', '宝塚記念'], 50000);

                // 9. 秋古馬3冠（天皇賞（秋）・ジャパンカップ・有馬記念同一競走馬制覇：+5億円）
                checkHorseSweep('🍁 秋古馬3冠', ['天皇賞（秋）', 'ジャパンカップ', '有馬記念'], 50000);

                data.finalAwards = awards;
                data.phase = 'final_awards';
            }

            leaveRoom() {
                if (this.raceInterval) {
                    clearInterval(this.raceInterval);
                    this.raceInterval = null;
                }
                if (this.unsubscribeRoom) {
                    this.unsubscribeRoom();
                    this.unsubscribeRoom = null;
                }
                this.roomId = null;
                this.roomData = null;
                this.renderGame();
            }

            syncAutoRaceTimer(data) {
                const isHost = data && data.hostId === this.playerId;
                const isRacing = data && data.phase === 'racing' && data.raceState && data.raceState.turn < data.raceState.maxTurns;

                if (isHost && isRacing) {
                    if (!this.raceInterval) {
                        this.raceInterval = setInterval(() => {
                            if (this.roomData && this.roomData.phase === 'racing' && this.roomData.hostId === this.playerId) {
                                this.advanceRaceTurn();
                            } else {
                                clearInterval(this.raceInterval);
                                this.raceInterval = null;
                            }
                        }, 3000);
                    }
                } else if (this.raceInterval) {
                    clearInterval(this.raceInterval);
                    this.raceInterval = null;
                }
            }

            // ==========================================
            // 8. UI レンダリング
            // ==========================================
            renderGame() {
                const headerStatus = document.getElementById('header-status');
                const main = document.getElementById('main-content');
                if (!headerStatus || !main) return;

                this.syncAutoRaceTimer(this.roomData);

                if (!this.roomData) {
                    headerStatus.innerHTML = `
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold ${firebaseDb ? 'bg-emerald-800 text-emerald-200 border border-emerald-500/40' : 'bg-amber-900/80 text-amber-200'}">
                            ${firebaseDb ? '🟢 オンライン同期対応' : '🟡 ローカルモード'}
                        </span>
                    `;
                    main.innerHTML = this.renderTitleScreen();
                    return;
                }

                const data = this.roomData;
                const races = this.getActiveRaces(data);
                const currentRace = races[data.raceIndex];
                const me = data.players.find(p => p.id === this.playerId);

                headerStatus.innerHTML = `
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="bg-slate-800/90 border border-slate-600 px-2.5 py-1 rounded-lg text-xs font-mono">
                            部屋ID: <strong class="text-amber-300 select-all">${data.roomId}</strong>
                        </span>
                        ${currentRace && data.phase !== 'lobby' && data.phase !== 'final_awards' ? `
                            <span class="bg-emerald-900 border border-emerald-600 px-2.5 py-1 rounded-lg text-xs font-bold">
                                第${data.raceIndex + 1}/${races.length}戦: ${currentRace.name}
                            </span>
                        ` : ''}
                        ${me ? `
                            <span class="bg-amber-950 border border-amber-500/60 px-2.5 py-1 rounded-lg text-xs font-bold text-amber-300">
                                💰 ${formatMoney(me.money)}
                            </span>
                        ` : ''}
                        <button onclick="window.gameApp.leaveRoom()" class="bg-red-950/80 hover:bg-red-800 border border-red-700 px-2.5 py-1 rounded-lg text-xs text-red-200 transition">
                            退室
                        </button>
                    </div>
                `;

                switch (data.phase) {
                    case 'lobby':
                        main.innerHTML = this.renderLobby(data);
                        break;
                    case 'auction':
                        main.innerHTML = this.renderAuction(data);
                        break;
                    case 'paddock':
                        main.innerHTML = this.renderPaddock(data);
                        break;
                    case 'racing':
                        main.innerHTML = this.renderRacing(data);
                        break;
                    case 'race_result':
                        main.innerHTML = this.renderRaceResult(data);
                        break;
                    case 'final_awards':
                        main.innerHTML = this.renderFinalAwards(data);
                        break;
                    default:
                        main.innerHTML = this.renderTitleScreen();
                }
            }

            renderTitleScreen() {
                return `
                    <div class="max-w-3xl mx-auto space-y-6">
                        <div class="turf-pattern border border-emerald-700/70 rounded-2xl p-6 sm:p-8 shadow-2xl text-center">
                            <div class="inline-block bg-amber-500/20 border border-amber-400/50 text-amber-300 text-xs font-bold px-3 py-1 rounded-full mb-3">

                                                        <span class="text-xs font-bold text-slate-400">【${cat}枠】</span>

                                                        <div class="font-bold text-sm text-amber-300 mt-0.5">${eq.name}</div>

                                            <div class="text-lg font-black text-purple-300">??? 〜 ???</div>

                            </div>
                        </div>

                `;
            }

            renderRacing(data) {
                const races = this.getActiveRaces(data);
                const race = races[data.raceIndex];
                const rs = data.raceState;
                const isHost = data.hostId === this.playerId;
                const isSecret = this.isSecretMode(data);
                const nextTurn = Math.min(rs.maxTurns, rs.turn + 1);
                const nextStage = this.getStageForTurn(nextTurn, race.track, rs.maxTurns);
                const maxProg = Math.max(rs.maxTurns, ...rs.runners.map(r => r.progress + 1));
                const topProgress = Math.max(...rs.runners.map(r => r.progress));
                const currentMeters = rs.turn * 100;
                const nextMeters = nextTurn * 100;

                return `
                    <div class="max-w-5xl mx-auto space-y-5">

                                const player = data.players.find(p => p.id === runner.playerId);
                                const horse = player.horses.find(h => h.id === runner.horseId);

                                const ability = this.getRunnerAbilityBreakdown(player, horse, race, nextStage.key);
                                const pct = Math.min(92, Math.round((runner.progress / maxProg) * 90));

                                            <div class="flex items-center gap-2">

                                                <span class="text-xs font-bold px-1.5 py-0.5 rounded ${runner.sex === '牝' ? 'bg-pink-600 text-white' : 'bg-sky-600 text-white'}">${runner.sex}</span>
                                                <span class="font-black text-white text-base">${runner.horseName}</span>
                                                <span class="text-xs text-slate-400">（${runner.playerName}）</span>
                                            </div>
                                            <div class="flex flex-wrap items-center gap-2">
                                                ${!isSecret ? `
                                                    <span class="bg-indigo-950 border border-indigo-500/60 text-indigo-200 text-xs font-bold px-2.5 py-1 rounded-lg">
                                                        📊 出目: ${currentRange.min}〜${currentRange.max}
                                                    </span>
                                                ` : `
                                                    <span class="bg-purple-950/90 border border-purple-500/50 text-purple-200 text-xs font-bold px-2.5 py-1 rounded-lg">
                                                        🕵️ 出目レンジ: ???
                                                    </span>
                                                `}
                                                ${runner.lastRoll !== null ? `
                                                    <span class="${runner.lastMoved ? 'bg-amber-400 text-slate-950 ring-2 ring-amber-200' : 'bg-slate-700 text-slate-300'} text-xs font-black px-2.5 py-1 rounded-lg">
                                                        🎲 出目 ${runner.lastRoll} ${runner.lastMoved ? '（+1マス前進！）' : ''}
                                                    </span>
                                                ` : ''}

                                                    ${bashinLabel}
                                                </span>
                                                <span class="text-sm font-black text-emerald-400 min-w-[68px] text-right">
                                                    ${runner.progress}マス

                                        <div class="flex flex-wrap items-center gap-1.5 text-[11px] bg-slate-950/60 border border-slate-700/80 rounded-lg px-2.5 py-2">

                                                <span class="px-2 py-0.5 rounded font-bold bg-amber-500/20 text-amber-300 border border-amber-400/50">
                                                    🏆 勝ち鞍: ${horse.wonRaceNames.join('・')}
                                                </span>
                                            ` : ''}
                                            ${isSecret ? `
                                                <span class="px-2 py-0.5 rounded font-bold bg-purple-950/90 text-purple-200 border border-purple-600/50">
                                                    📏 適性: ???
                                                </span>
                                                <span class="px-2 py-0.5 rounded font-bold bg-purple-950/90 text-purple-200 border border-purple-600/50">
                                                    ⚡ 脚質: ???
                                                </span>
                                                <span class="px-2 py-0.5 rounded font-bold bg-purple-950/90 text-purple-200 border border-purple-600/50">
                                                    🔥 気性難: ???
                                                </span>
                                            ` : `
                                                <span class="px-2 py-0.5 rounded font-bold ${ability.isDistMatch ? 'bg-emerald-800/90 text-emerald-200 border border-emerald-500/40' : 'bg-slate-800 text-slate-300'}">
                                                    📏 ${ability.distLabel}

                                                <span class="px-2 py-0.5 rounded font-bold ${ability.isStyleActive ? 'bg-amber-600/90 text-white border border-amber-300/60 animate-pulse' : 'bg-indigo-950/90 text-indigo-200 border border-indigo-700/50'}">
                                                    ⚡ ${ability.styleLabel}
                                                </span>
                                                ${ability.unrulyStatus ? `
                                                    <span class="px-2 py-0.5 rounded font-bold ${ability.cancelUnruly ? 'bg-teal-900/90 text-teal-200 border border-teal-500/40' : 'bg-rose-950/90 text-rose-200 border border-rose-500/40'}">

            renderRaceResult(data) {
                const res = data.lastRaceResult;
                const races = this.getActiveRaces(data);
                const isHost = data.hostId === this.playerId;
                const isLastRace = data.raceIndex + 1 >= races.length;
                const photoLogs = res.photoFinishLogs || [];

                return `
                    <div class="max-w-3xl mx-auto bg-slate-900 border border-amber-500/60 rounded-2xl p-6 shadow-2xl space-y-6">
                        <div class="text-center border-b border-slate-700 pb-4">

                                <div class="flex items-center justify-between border-b border-amber-500/40 pb-2">

                                        <span class="text-xl">📸</span>
                                        <span class="font-black text-amber-300 tracking-wider text-sm sm:text-base">PHOTO FINISH！写真判定決着</span>
                                    </div>
                                    <span class="text-[11px] bg-amber-500 text-slate-950 font-black px-2.5 py-0.5 rounded-full">同着決戦ダイス</span>
                                </div>
                                <p class="text-xs text-amber-100">
                                    ゴール時点で累計マス数が並んだため、最終盤の出目レンジ（最小値〜最大値）による決着ダイスでハナ差判定を行いました！
                                </p>
                                <div class="space-y-2">
                                    ${photoLogs.map(log => `
                                        <div class="bg-slate-950/70 border border-amber-500/30 rounded-xl p-3 space-y-2">
                                            <div class="text-xs font-bold text-amber-300">

                                            </div>
                                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                ${log.entries.sort((a, b) => b.roll - a.roll).map((ent, i) => `
                                                    <div class="flex items-center justify-between bg-slate-900 px-3 py-2 rounded-lg border ${i === 0 ? 'border-amber-400' : 'border-slate-700'}">
                                                        <div>
                                                            <div class="text-xs font-black text-white">${ent.horseName}</div>
                                                            <div class="text-[10px] text-slate-400">${this.isSecretMode(data) ? '最終出目レンジ: ???' : `最終出目レンジ: ${ent.min}〜${ent.max}`}</div>
                                                        </div>
                                                        <div class="text-right">
                                                            <span class="inline-block px-2.5 py-1 rounded font-black text-sm ${i === 0 ? 'bg-amber-400 text-slate-950' : 'bg-slate-700 text-slate-200'}">
                                                                🎲 ${ent.roll}
                                                            </span>
                                                        </div>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        </div>

                                </div>
                            </div>
                        ` : ''}

                        <div class="space-y-3">
                            ${res.standings.map(st => `
                                <div class="flex flex-wrap items-center justify-between gap-2 p-4 rounded-xl border ${st.rank === 1 ? 'bg-amber-950/50 border-amber-400' : 'bg-slate-800 border-slate-700'}">
                                    <div class="flex items-center gap-3">
                                        <span class="w-8 h-8 rounded-full flex items-center justify-center font-black text-sm ${st.rank === 1 ? 'bg-amber-400 text-slate-950' : st.rank === 2 ? 'bg-slate-300 text-slate-950' : st.rank === 3 ? 'bg-amber-700 text-white' : 'bg-slate-700 text-slate-300'}">
                                            ${st.rank}着
                                        </span>
                                        <div>
                                            <div class="font-black text-white text-base flex items-center gap-2">

                                                <span class="text-xs font-normal text-slate-400">（${st.playerName}）</span>
                                                ${st.hadPhotoFinish ? '<span class="text-[10px] bg-rose-600/90 text-white px-2 py-0.5 rounded-full font-bold">📸 ハナ差判定</span>' : ''}

                                            <div class="text-xs text-slate-400">獲得進捗: ${st.progress}マス</div>

                                    <div class="text-right">
                                        <div class="font-black text-amber-300 text-base">+${formatMoney(st.prize)}</div>
                                        ${st.kobanApplied ? '<div class="text-[11px] font-bold text-emerald-400">🪙 こばん効果×2!</div>' : ''}
                                    </div>

                        ${isHost ? `

                            </button>
                        ` : `
                            <div class="text-center text-sm text-amber-300 font-bold py-3 bg-slate-800 rounded-xl">
                                ホストが次の画面へ進めるのを待っています...
                            </div>
                        `}
                    </div>
                `;
            }

            renderFinalAwards(data) {
                const sortedPlayers = [...data.players].sort((a, b) => b.money - a.money);
                const awards = data.finalAwards || [];

                return `
                    <div class="max-w-4xl mx-auto space-y-6">
                        <!-- TURF DICE DERBY AWARDS 表彰 -->
                        <div class="bg-gradient-to-b from-amber-950/90 to-slate-900 border-2 border-amber-400 rounded-2xl p-6 shadow-2xl space-y-5">

                                <div class="text-xs font-black tracking-widest text-amber-400">ANNUAL GRAND PRIX CEREMONY</div>

                                <p class="text-xs text-amber-200 mt-1">全G1日程を終え、輝かしい栄誉を称える特別ボーナス賞金が授与されました！</p>
                            </div>

                            ` : `
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    ${awards.map(aw => `
                                        <div class="bg-slate-900/90 border border-amber-500/50 rounded-xl p-4">
                                            <div class="flex items-center justify-between">
                                                <span class="font-black text-amber-300 text-sm">${aw.title}</span>
                                                <span class="bg-amber-500 text-slate-950 text-xs font-black px-2 py-0.5 rounded">+${formatMoney(aw.prize)}</span>
                                            </div>
                                            <div class="text-sm font-bold text-white mt-1.5">${aw.winners}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>

                        <!-- 最終総資産ランキング -->
                        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
                            <h3 class="text-xl font-black text-white border-b border-slate-700 pb-3">👑 最終オーナー総資産ランキング</h3>
                            <div class="space-y-3">
                                ${sortedPlayers.map((p, idx) => `
                                    <div class="flex items-center justify-between p-4 rounded-xl border ${idx === 0 ? 'bg-amber-950/40 border-amber-400' : 'bg-slate-800 border-slate-700'}">
                                        <div class="flex items-center gap-3">
                                            <span class="text-xl font-black ${idx === 0 ? 'text-amber-400' : 'text-slate-400'}">${idx + 1}位</span>
                                            <div>
                                                <div class="font-black text-white text-lg">${p.name}</div>
                                                <div class="text-xs text-slate-400">${p.stable}所属 ／ G1通算 ${p.wins}勝</div>
                                            </div>
                                        </div>
                                        <div class="text-xl sm:text-2xl font-black text-amber-300">${formatMoney(p.money)}</div>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="pt-4 text-center">
                                <button onclick="window.gameApp.leaveRoom()"
                                    class="bg-emerald-600 hover:bg-emerald-500 text-white font-black px-8 py-3.5 rounded-xl shadow-lg transition">
                                    タイトル画面へ戻る
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        window.onload = function () {
            window.gameApp = new TurfDiceDerby();
            window.gameApp.renderGame();
        };
    </script>
</body>
</html>
